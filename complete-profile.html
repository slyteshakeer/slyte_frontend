<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - Slyte</title>
    <meta name="description" content="Complete your profile details for Slyte custom fit menswear.">
    <meta name="robots" content="noindex, follow">

    <!-- Central Application Config -->
    <script src="js/config.js"></script>

    <!-- Cloudflare Web Analytics -->
    <!-- <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "YOUR_CLOUDFLARE_BEACON_TOKEN"}'></script> -->

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/png" href="images/logos/slyte-only-logo-black.png">
    <style>
        :root {
            --primary-black: #1d1d1f;
            --primary-white: #ffffff;
            --light-gray: #f5f5f7;
            --medium-gray: #86868b;
            --border-color: #d2d2d7;
            --accent-blue: #0066cc;
        }

        body {
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            margin: 0;
            color: var(--primary-black);
        }

        .profile-container {
            background: var(--primary-white);
            padding: 48px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 520px;
            transition: all 0.3s ease;
        }

        .profile-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .profile-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.8px;
            color: var(--primary-black);
        }

        .profile-header p {
            color: var(--medium-gray);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--medium-gray);
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background: var(--primary-white);
            color: var(--primary-black);
        }

        .form-group input:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .form-group input[readonly] {
            background-color: #fcfcfc;
            color: var(--medium-gray);
            cursor: not-allowed;
            border-style: solid;
            opacity: 0.7;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background-color: var(--primary-black);
            color: var(--primary-white);
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .submit-btn:hover {
            background-color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background-color: #e8e8ed;
            color: #a1a1a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            background: rgba(255, 59, 48, 0.08);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 59, 48, 0.1);
            display: none;
        }

        .address-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 32px 24px;
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .address-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="images/logos/slyte-logo-black.png" alt="Slyte Logo" width="120" height="35">
            </a>
        </div>
        <div class="header-icons">
            <a href="wishlist.html" class="icon-btn">
                <span class="material-symbols-outlined">favorite</span>
            </a>
            <a href="cart.html" class="icon-btn cart-icon-btn">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="cart-count">0</span>
            </a>
            <button class="menu-btn">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <h1>Complete Profile</h1>
            <p>Tell us a bit more about yourself</p>
        </div>

        <form id="profileForm">
            <!-- Email (Read-only) -->
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="pEmail" readonly tabindex="-1">
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="pName" placeholder="Enter your full name" required autocomplete="name">
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="pPhone" placeholder="10-digit mobile number" required pattern="[0-9]{10}"
                    maxlength="10" autocomplete="tel">
            </div>

            <!-- Address Line 1 -->
            <div class="form-group">
                <label>House / Street Address *</label>
                <input type="text" id="pAddress" placeholder="Apt, Building, Street" required
                    autocomplete="address-line1">
            </div>

            <div class="address-grid">
                <!-- City -->
                <div class="form-group">
                    <label>City *</label>
                    <input type="text" id="pCity" placeholder="City" required autocomplete="address-level2">
                </div>
                <!-- State -->
                <div class="form-group">
                    <label>State *</label>
                    <input type="text" id="pState" placeholder="State" required autocomplete="address-level1">
                </div>
            </div>

            <!-- Pincode -->
            <div class="form-group">
                <label>Pincode *</label>
                <input type="text" id="pPincode" placeholder="6-digit Pincode" pattern="[0-9]{6}" maxlength="6" required
                    autocomplete="postal-code">
            </div>

            <button type="submit" class="submit-btn" id="saveProfileBtn">
                Save & Continue
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
            <div class="error-msg" id="profileError"></div>
        </form>
    </div>

    <script type="module">
        import { auth, db, saveUserProfile } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const form = document.getElementById('profileForm');
        const emailInput = document.getElementById('pEmail');
        const nameInput = document.getElementById('pName');
        const phoneInput = document.getElementById('pPhone');
        const saveBtn = document.getElementById('saveProfileBtn');
        const errorDiv = document.getElementById('profileError');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Mandatory email verification check
                if (!user.emailVerified) {
                    window.location.href = 'index.html';
                    return;
                }

                emailInput.value = user.email || '';

                // Pre-fill data from Firestore if it exists (but incomplete)
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    const data = userSnap.data();
                    if (data.profileComplete) {
                        window.location.href = 'index.html';
                        return;
                    }
                    if (data.name) nameInput.value = data.name;
                    if (data.phone) phoneInput.value = data.phone;
                } else if (user.displayName) {
                    nameInput.value = user.displayName;
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            errorDiv.style.display = 'none';
            saveBtn.disabled = true;
            const originalBtnText = saveBtn.innerHTML;
            saveBtn.innerHTML = 'Saving...';

            const profileData = {
                name: nameInput.value,
                phone: phoneInput.value,
                email: emailInput.value,
                address: {
                    line1: document.getElementById('pAddress').value,
                    city: document.getElementById('pCity').value,
                    state: document.getElementById('pState').value,
                    pincode: document.getElementById('pPincode').value
                },
                profileComplete: true,
                updatedAt: new Date()
            };

            const result = await saveUserProfile(auth.currentUser, profileData);

            if (result.success) {
                window.location.href = 'index.html';
            } else {
                errorDiv.textContent = result.error;
                errorDiv.style.display = 'block';
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalBtnText;
            }
        });
    </script>

    <nav class="bottom-nav">

            <span class="material-symbols-outlined">home</span>
        </a>
        <a href="search.html" class="nav-item">

        <a href="ai-fit.html" class="nav-item-center">

        <a href="shop.html" class="nav-item">

    <div class="menu-overlay" id="menuOverlay"></div>

            <h2>Menu</h2>

        <nav class="menu-nav">
            <a href="wishlist.html" class="menu-item">

            </a>
            <a href="orders.html" class="menu-item">

</body>
