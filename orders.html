<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders & After-Sales — Slyte</title>
    <meta name="description" content="Manage your Slyte trouser orders, track delivery, request returns, exchanges, or custom fit alterations." />
    <meta name="robots" content="noindex, follow">

    <!-- Central Application Config -->
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/png" href="images/logos/slyte-only-logo-black.png">

    <style>
        :root {
            --bg-body: #fafafa;
            --surface: #ffffff;
            --surface-subtle: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            
            --navy-primary: #0f172a;
            --navy-secondary: #1e293b;
            --navy-accent: #2563eb;
            --navy-muted: #64748b;
            
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            
            /* Status Colors */
            --green-bg: #f0fdf4;
            --green-border: #bbf7d0;
            --green-text: #166534;
            
            --red-bg: #fef2f2;
            --red-border: #fecaca;
            --red-text: #991b1b;
            
            --blue-bg: #eff6ff;
            --blue-border: #bfdbfe;
            --blue-text: #1e40af;
            
            --amber-bg: #fffbebf0;
            --amber-border: #fde68a;
            --amber-text: #92400e;
            
            --radius-card: 16px;
            --radius-inner: 12px;
            --radius-btn: 10px;
            --shadow-subtle: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
            --shadow-modal: 0 24px 48px -12px rgba(15, 23, 42, 0.2);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Brand Navigation */
        .brand-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--navy-primary);
        }

        .brand-logo img {
            height: 24px;
            width: auto;
        }

        .brand-logo span {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .header-help-btn {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface-subtle);
            border: 1px solid var(--border-light);
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Phone Lookup Hero */
        .lookup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 24px;
        }

        .lookup-card h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--navy-primary);
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .lookup-card p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .phone-input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .phone-prefix {
            position: absolute;
            left: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy-primary);
            pointer-events: none;
        }

        #mobileInput {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            padding: 0 12px 0 46px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            background: var(--surface-subtle);
            transition: var(--transition);
        }

        #mobileInput:focus {
            border-color: var(--navy-primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        #trackBtn {
            height: 48px;
            padding: 0 20px;
            background: var(--navy-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-inner);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        #trackBtn:active {
            transform: scale(0.97);
        }

        /* Demo / Scenario Simulator Bar */
        .scenario-bar {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-inner);
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .scenario-bar label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scenario-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            outline: none;
            cursor: pointer;
        }

        /* Order Card Component */
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition);
        }

        .card-header-row {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #ffffff;
        }

        .order-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .order-id-code {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy-primary);
            line-height: 1.3;
        }

        .fit-spec {
            font-size: 13px;
            font-weight: 500;
            color: var(--navy-muted);
        }

        .tag-pill {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 4px;
        }

        .tag-standard { background: #e2e8f0; color: #334155; }
        .tag-custom { background: #f3e8ff; color: #6b21a8; }

        .card-content {
            padding: 20px;
        }

        /* Timeline Stepper Component */
        .timeline-stepper {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            margin: 16px 0 24px 0;
            padding: 0 4px;
        }

        .timeline-stepper::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: #e2e8f0;
            z-index: 1;
        }

        .step-node {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
        }

        .node-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .step-node.done .node-circle {
            background: var(--navy-primary);
            border-color: var(--navy-primary);
            color: #ffffff;
        }

        .step-node.active .node-circle {
            background: #ffffff;
            border-color: var(--navy-primary);
            color: var(--navy-primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.15);
        }

        .step-node.active-amber .node-circle {
            background: #ffffff;
            border-color: #d97706;
            color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
        }

        .step-node.active-green .node-circle {
            background: #22c55e;
            border-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }

        .node-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            line-height: 1.25;
            max-width: 72px;
        }

        .step-node.done .node-label,
        .step-node.active .node-label {
            color: var(--navy-primary);
            font-weight: 700;
        }

        /* Status Banners */
        .status-banner {
            border-radius: var(--radius-inner);
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-banner-title {
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-banner-desc {
            font-size: 13px;
            line-height: 1.4;
            opacity: 0.9;
        }

        .banner-green { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green-text); }
        .banner-red { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red-text); }
        .banner-blue { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue-text); }
        .banner-amber { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); }

        /* Warning Card for Missing Bank Details */
        .bank-warning-card {
            background: #fffbe6;
            border: 1px dashed #d97706;
            border-radius: var(--radius-inner);
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .bank-warning-info h4 {
            font-size: 13px;
            font-weight: 800;
            color: #92400e;
            margin-bottom: 2px;
        }

        .bank-warning-info p {
            font-size: 12px;
            color: #b45309;
        }

        .btn-add-bank {
            background: #d97706;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Order Summary / Quick Info Rows */
        .info-grid {
            background: var(--surface-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-inner);
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .info-label {
            color: var(--navy-muted);
            font-weight: 500;
        }

        .info-val {
            color: var(--navy-primary);
            font-weight: 700;
            text-align: right;
        }

        /* Action Buttons Grid */
        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-btn);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition);
            border: 1px solid transparent;
            text-align: center;
        }

        .btn-primary { background: var(--navy-primary); color: #ffffff; }
        .btn-primary:active { background: var(--navy-secondary); }

        .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--navy-primary); }
        .btn-secondary:active { background: var(--surface-subtle); }

        .btn-outline-blue { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
        .btn-outline-green { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
        .btn-outline-purple { background: #f3e8ff; border-color: #e9d5ff; color: #6b21a8; }

        .btn-details-toggle {
            width: 100%;
            background: none;
            border: 1px solid var(--border);
            color: var(--navy-muted);
            padding: 10px;
            border-radius: var(--radius-btn);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 12px;
            transition: var(--transition);
        }

        .btn-details-toggle:hover {
            color: var(--navy-primary);
            background: var(--surface-subtle);
        }

        /* Expanded Details Section */
        .details-expand-panel {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .detail-box {
            background: var(--surface-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-inner);
            padding: 14px;
            margin-bottom: 16px;
        }

        .detail-box-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--navy-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-box-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .detail-box-row:last-child {
            margin-bottom: 0;
        }

        /* Modal Overlay & Card */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1000;
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-modal);
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy-primary);
            margin-bottom: 4px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--navy-muted);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #ffffff;
            transition: var(--transition);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--navy-primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .form-disclaimer {
            font-size: 12px;
            color: var(--navy-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Adjustment Pills */
        .adj-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .adj-pill {
            padding: 10px 4px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--navy-primary);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
        }

        .adj-pill.active {
            background: var(--navy-primary);
            color: #ffffff;
            border-color: var(--navy-primary);
        }

        /* Bottom Fixed Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 12px 0;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--navy-primary);
            font-weight: 800;
        }

        .nav-item .material-symbols-outlined {
            font-size: 22px;
        }

        .masked-acc-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .masked-acc-info {
            font-size: 13px;
            font-weight: 700;
            color: var(--navy-primary);
        }

        .masked-acc-sub {
            font-size: 11px;
            color: var(--navy-muted);
        }
    </style>
</head>

<body>

    <!-- Header Navbar -->
    <header class="brand-header">
        <a href="index.html" class="brand-logo">
            <img src="images/logos/slyte-logo-black.png" alt="Slyte Logo">
        </a>
        <a href="https://wa.me/916363887497" target="_blank" class="header-help-btn">
            <span class="material-symbols-outlined" style="font-size:16px">help_outline</span> Need Help?
        </a>
    </header>

    <div class="container">
        <!-- Phone Lookup Card -->
        <div class="lookup-card">
            <h1>Look Up Your Orders</h1>
            <p>Enter the mobile number used during checkout to view delivery status and after-sales options.</p>
            <div class="input-group">
                <div class="phone-input-wrap">
                    <span class="phone-prefix">+91</span>
                    <input type="tel" id="mobileInput" placeholder="97420 06683" maxlength="10">
                </div>
                <button id="trackBtn" onclick="fetchOrders()">Look Up</button>
            </div>
        </div>

        <!-- Scenario Tester / Simulator Bar -->
        <div class="scenario-bar">
            <label>
                <span>🧪 Test Journey Simulator (Test Mobile 9742006683)</span>
                <span style="font-size:10px; color:#64748b;">Live Preview</span>
            </label>
            <select id="scenarioSelect" class="scenario-select" onchange="applyScenarioSimulation()">
                <option value="REAL">Standard Live Order Flow (Default)</option>
                <optgroup label="1. Normal Delivered">
                    <option value="SIM_DELIVERED">1. Delivered Order (Standard / Custom)</option>
                </optgroup>
                <optgroup label="2. Return Journey Scenarios">
                    <option value="SIM_RET_REQ">2. Return Requested (With Bank Warning)</option>
                    <option value="SIM_RET_PICKED">3. Return Picked Up (In Transit)</option>
                    <option value="SIM_RET_REC">4. Return Received at Slyte</option>
                    <option value="SIM_RET_REFUNDED">5. Refund Processed (Completed)</option>
                </optgroup>
                <optgroup label="3. Exchange Journey Scenarios">
                    <option value="SIM_EXC_REQ">6. Exchange Requested</option>
                    <option value="SIM_EXC_PICKED">7. Exchange Item Picked Up</option>
                    <option value="SIM_EXC_REC">8. Exchange Item Received</option>
                    <option value="SIM_EXC_SHIPPED">9. Exchange Shipped (Replacement En Route)</option>
                    <option value="SIM_EXC_DELIVERED">10. Exchange Delivered (Completed)</option>
                </optgroup>
                <optgroup label="4. Alteration Journey Scenarios">
                    <option value="SIM_ALT_REQ">11. Alteration Requested</option>
                    <option value="SIM_ALT_PICKED">12. Alteration Picked Up</option>
                    <option value="SIM_ALT_REC">13. Alteration Received at Slyte</option>
                    <option value="SIM_ALT_INPROG">14. Alteration in Progress</option>
                    <option value="SIM_ALT_DONE">15. Alteration Completed</option>
                    <option value="SIM_ALT_SHIPPED">16. Alteration Shipped</option>
                    <option value="SIM_ALT_DELIVERED">17. Alteration Delivered (Completed)</option>
                </optgroup>
            </select>
        </div>

        <!-- Orders Results Container -->
        <div id="resultsArea">
            <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:14px;">
                Enter your phone number above to view orders.
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">

    <!-- Generic Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = (window.SLYTE_API_BASE || window.SLYTE_CONFIG?.API_BASE_URL || 'https://api.slyte.in').replace(/\/+$/, '');
            let currentOrders = [];
            let activeSimulationKey = "REAL";

            // Helper Utilities
            function esc(s) {
                return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmtDate(dStr) {
                if (!dStr) return 'N/A';
                const d = new Date(dStr);
                return isNaN(d.getTime()) ? dStr : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            }

            // Global fetchOrders
            window.fetchOrders = async function () {
                const phoneInput = document.getElementById('mobileInput');
                const resultsArea = document.getElementById('resultsArea');
                const rawPhone = phoneInput.value.replace(/\D/g, '').slice(-10);

                if (rawPhone.length < 10) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:20px; color:var(--red-text); font-weight:600;">Please enter a valid 10-digit mobile number.</div>`;
                    return;
                }

                localStorage.setItem('slyte_phone', rawPhone);
                resultsArea.innerHTML = `<div style="text-align:center; padding:40px; color:var(--navy-muted); font-size:14px;">Loading your orders...</div>`;

                try {
                    const token = localStorage.getItem('slyte_otp_token');
                    const res = await fetch(`${API_BASE}/orders/lookup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({ phone: rawPhone })
                    });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.orders)) {
                        currentOrders = data.orders;
                        renderOrders(currentOrders);
                    } else {
                        resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--navy-muted); font-size:14px;">No orders found for +91 ${rawPhone}.</div>`;
                    }
                } catch (err) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--red-text); font-size:14px;">Could not connect to server. Please try again.</div>`;
                }
            };

            window.applyScenarioSimulation = function() {
                activeSimulationKey = document.getElementById('scenarioSelect').value;
                if (currentOrders && currentOrders.length > 0) {
                    renderOrders(currentOrders);
                } else {
                    // Inject a mock test order to demonstrate scenario
                    currentOrders = [{
                        orderId: "SLYTE-TEST-ORDER-001",
                        displayId: "SLYTE-ORD-001",
                        productName: "Slyte 24H Trouser",
                        fitType: "Standard Fit",
                        productType: "STANDARD",
                        amount: 1699,
                        paymentGroup: "Cashfree UPI",
                        createdAt: new Date().toISOString(),
                        deliveryAddress: {
                            fullName: "Valued Customer",
                            addressLine1: "123 Test Street, Koramangala",
                            city: "Bengaluru",
                            state: "Karnataka",
                            pincode: "560034"
                        },
                        orderLifecycleStatus: "DELIVERED"
                    }];
                    renderOrders(currentOrders);
                }
            };

            // Main Renderer
            function renderOrders(ordersList) {
                const resultsArea = document.getElementById('resultsArea');
                if (!ordersList || !ordersList.length) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--navy-muted);">No orders found.</div>`;
                    return;
                }

                resultsArea.innerHTML = ordersList.map((rawOrder, idx) => {
                    // Combine real order data with simulation state if selected
                    const order = applyStateTransformation(rawOrder, activeSimulationKey);
                    const mode = order.journeyMode; // NORMAL, RETURN, EXCHANGE, ALTERATION

                    return `
                    <div class="order-card" id="card-${esc(order.orderId)}">
                        <!-- Header -->
                        <div class="card-header-row">
                            <div class="order-meta">
                                <span class="order-id-code">${esc(order.displayId || order.orderId)}</span>
                                <div class="product-title">${esc(order.productName || 'Slyte 24H Trouser')}</div>
                                <div class="fit-spec">
                                    ${esc(order.fitType || 'Standard Fit')} • Size ${esc(order.size || '32')}
                                    <span class="tag-pill ${order.productType === 'CUSTOM' ? 'tag-custom' : 'tag-standard'}">
                                        ${order.productType === 'CUSTOM' ? 'Custom' : 'Standard'}
                                    </span>
                                </div>
                            </div>
                            <div style="font-size:16px; font-weight:800; color:var(--navy-primary);">
                                ₹${order.amount || 1699}
                            </div>
                        </div>

                        <div class="card-content">
                            <!-- Stepper Timeline -->
                            ${renderJourneyStepper(mode, order.stepIndex, order.stepperSteps)}

                            <!-- Status Banner -->
                            <div class="status-banner ${order.bannerClass}">
                                <div class="status-banner-title">
                                    <span>${order.bannerIcon}</span>
                                    <span>${order.bannerTitle}</span>
                                </div>
                                <div class="status-banner-desc">${order.bannerMessage}</div>
                            </div>

                            <!-- Bank Warning Banner (if return requested & bank details missing) -->
                            ${order.needsBankDetails ? `
                            <div class="bank-warning-card">
                                <div class="bank-warning-info">
                                    <h4>Refund details required</h4>
                                    <p>Add your bank account details so we can process your refund.</p>
                                </div>
                                <button class="btn-add-bank" onclick="openBankDetailsModal('${esc(order.orderId)}')">Add Bank Details</button>
                            </div>` : ''}

                            <!-- Masked Bank Account Display (if saved for Return) -->
                            ${(mode === 'RETURN' && order.bankDetailsSaved) ? `
                            <div class="masked-acc-box">
                                <div>
                                    <div class="masked-acc-info">Account ending •••• ${esc(order.bankDetailsSaved.maskedAcc)}</div>
                                    <div class="masked-acc-sub">IFSC: ${esc(order.bankDetailsSaved.ifsc)}</div>
                                </div>
                                <button class="btn-action btn-secondary" style="padding:6px 12px; font-size:11px;" onclick="openBankDetailsModal('${esc(order.orderId)}')">Edit</button>
                            </div>` : ''}

                            <!-- Action Buttons -->
                            <div class="actions-group">
                                ${renderContextualActions(mode, order)}
                            </div>

                            <!-- Toggle Show Details -->
                            <button class="btn-details-toggle" id="btn-toggle-${esc(order.orderId)}" onclick="toggleDetails('${esc(order.orderId)}')">
                                Show Details ▼
                            </button>

                            <!-- Dynamic Expanded Details Panel -->
                            <div class="details-expand-panel" id="expand-${esc(order.orderId)}">
                                ${renderExpandedDetails(mode, order)}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            // State Resolver & Simulator Engine
            function applyStateTransformation(order, simKey) {
                const o = JSON.parse(JSON.stringify(order));
                const lcs = (o.orderLifecycleStatus || 'DELIVERED').toUpperCase();
                o.size = o.size || '32';
                o.productType = o.productType || (o.fitType && o.fitType.toLowerCase().includes('custom') ? 'CUSTOM' : 'STANDARD');

                // Check stored bank details for return
                const storedBank = localStorage.getItem(`bank_${o.orderId}`);
                if (storedBank) {
                    try {
                        const parsed = JSON.parse(storedBank);
                        o.bankDetailsSaved = {
                            maskedAcc: parsed.account_number.slice(-4) || '4821',
                            ifsc: parsed.ifsc_code || 'HDFC0001234'
                        };
                    } catch(e){}
                }

                // If simulation scenario is selected
                if (simKey && simKey !== 'REAL') {
                    return getSimulatedState(o, simKey);
                }

                // Default Real Backend State Engine
                if (['RETURN_INITIATED', 'RTO_IN_TRANSIT', 'RTO_DELIVERED', 'REFUNDED'].includes(lcs)) {
                    o.journeyMode = 'RETURN';
                    if (lcs === 'RETURN_INITIATED') {
                        o.stepIndex = 0;
                        o.bannerClass = 'banner-red';
                        o.bannerIcon = '↩';
                        o.bannerTitle = 'Return Requested';
                        o.bannerMessage = "Your return request has been confirmed. We'll arrange a pickup soon.";
                        if (!o.bankDetailsSaved) o.needsBankDetails = true;
                    } else if (lcs === 'RTO_IN_TRANSIT') {
                        o.stepIndex = 1;
                        o.bannerClass = 'banner-red';
                        o.bannerIcon = '🚚';
                        o.bannerTitle = 'Return Picked Up';
                        o.bannerMessage = "Your item is on its way to us. Your refund will be processed once we receive the item.";
                    } else if (lcs === 'RTO_DELIVERED') {
                        o.stepIndex = 2;
                        o.bannerClass = 'banner-amber';
                        o.bannerIcon = '📦';
                        o.bannerTitle = 'Return Received';
                        o.bannerMessage = "Your return has reached us. Your refund is now being processed.";
                    } else if (lcs === 'REFUNDED') {
                        o.stepIndex = 3;
                        o.bannerClass = 'banner-green';
                        o.bannerIcon = '✅';
                        o.bannerTitle = 'Refund Processed';
                        o.bannerMessage = `₹${o.amount || 1699} has been refunded successfully.`;
                    }
                    o.stepperSteps = ['Return Requested', 'Picked Up', 'Received', 'Refund Processed'];
                } else if (lcs.startsWith('EXCHANGE_')) {
                    o.journeyMode = 'EXCHANGE';
                    o.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                    o.exchangeNewSize = '34';
                    if (lcs === 'EXCHANGE_REQUESTED') {
                        o.stepIndex = 0; o.bannerClass = 'banner-blue'; o.bannerIcon = '🔄'; o.bannerTitle = 'Exchange Requested'; o.bannerMessage = 'Exchange confirmed. Replacement size will be prepared upon pickup.';
                    } else if (lcs === 'EXCHANGE_PICKED_UP') {
                        o.stepIndex = 1; o.bannerClass = 'banner-blue'; o.bannerIcon = '🚚'; o.bannerTitle = 'Exchange Item Picked Up'; o.bannerMessage = 'Your original item is on its way back to us.';
                    } else if (lcs === 'EXCHANGE_RECEIVED') {
                        o.stepIndex = 2; o.bannerClass = 'banner-blue'; o.bannerIcon = '📦'; o.bannerTitle = 'Exchange Item Received'; o.bannerMessage = 'We have received your item. Preparing replacement size 34.';
                    } else if (lcs === 'EXCHANGE_SHIPPED') {
                        o.stepIndex = 3; o.bannerClass = 'banner-blue'; o.bannerIcon = '🚚'; o.bannerTitle = 'Exchange Shipped'; o.bannerMessage = 'Your replacement trousers are on the way.';
                    } else if (lcs === 'EXCHANGE_DELIVERED') {
                        o.stepIndex = 4; o.bannerClass = 'banner-green'; o.bannerIcon = '✓'; o.bannerTitle = 'Exchange Delivered'; o.bannerMessage = 'Your replacement trousers have been delivered. We hope they fit perfectly.';
                    }
                } else if (lcs.startsWith('ALTERATION_')) {
                    o.journeyMode = 'ALTERATION';
                    o.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                    o.alterationSpecs = { waist: '31"', length: '39"' };
                    if (lcs === 'ALTERATION_REQUESTED') {
                        o.stepIndex = 0; o.bannerClass = 'banner-amber'; o.bannerIcon = '✂️'; o.bannerTitle = 'Alteration Requested'; o.bannerMessage = "We'll arrange a pickup for your trousers.";
                    } else if (lcs === 'ALTERATION_PICKED_UP') {
                        o.stepIndex = 1; o.bannerClass = 'banner-amber'; o.bannerIcon = '🚚'; o.bannerTitle = 'Picked Up'; o.bannerMessage = 'Your trousers have been picked up and are on their way to us.';
                    } else if (lcs === 'ALTERATION_RECEIVED') {
                        o.stepIndex = 2; o.bannerClass = 'banner-amber'; o.bannerIcon = '🏢'; o.bannerTitle = 'Received at Slyte'; o.bannerMessage = "We've received your trousers. Your alteration is now in progress.";
                    } else if (lcs === 'ALTERATION_IN_PROGRESS') {
                        o.stepIndex = 3; o.bannerClass = 'banner-amber'; o.bannerIcon = '✂️'; o.bannerTitle = 'Alteration in Progress'; o.bannerMessage = 'Our team is working on your trousers. Expected completion: 3 business days.';
                    } else if (lcs === 'ALTERATION_COMPLETED') {
                        o.stepIndex = 4; o.bannerClass = 'banner-blue'; o.bannerIcon = '✨'; o.bannerTitle = 'Alteration Completed'; o.bannerMessage = 'Your trousers have been altered and are ready to ship.';
                    } else if (lcs === 'ALTERATION_SHIPPED') {
                        o.stepIndex = 5; o.bannerClass = 'banner-blue'; o.bannerIcon = '🚚'; o.bannerTitle = 'Alteration Shipped'; o.bannerMessage = 'Your altered trousers are on the way.';
                    } else if (lcs === 'ALTERATION_DELIVERED') {
                        o.stepIndex = 6; o.bannerClass = 'banner-green'; o.bannerIcon = '✓'; o.bannerTitle = 'Alteration Delivered'; o.bannerMessage = 'Your altered trousers have been delivered. We hope they fit perfectly.';
                    }
                } else {
                    // Normal Forward Delivery Flow
                    o.journeyMode = 'NORMAL';
                    o.stepperSteps = ['Order Placed', 'Dispatched', 'Out for Delivery', 'Delivered'];
                    o.stepIndex = 3;
                    o.bannerClass = 'banner-green';
                    o.bannerIcon = '✓';
                    o.bannerTitle = 'Delivered';
                    o.bannerMessage = 'Enjoy your order.';
                }

                return o;
            }

            // Scenario Simulator Mapping
            function getSimulatedState(o, key) {
                const copy = JSON.parse(JSON.stringify(o));
                switch(key) {
                    case 'SIM_DELIVERED':
                        copy.journeyMode = 'NORMAL';
                        copy.stepperSteps = ['Order Placed', 'Dispatched', 'Out for Delivery', 'Delivered'];
                        copy.stepIndex = 3; copy.bannerClass = 'banner-green'; copy.bannerIcon = '✓'; copy.bannerTitle = 'Delivered'; copy.bannerMessage = 'Enjoy your order.';
                        break;
                    case 'SIM_RET_REQ':
                        copy.journeyMode = 'RETURN';
                        copy.stepperSteps = ['Return Requested', 'Picked Up', 'Received', 'Refund Processed'];
                        copy.stepIndex = 0; copy.bannerClass = 'banner-red'; copy.bannerIcon = '↩'; copy.bannerTitle = 'Return Requested'; copy.bannerMessage = "Your return request has been confirmed. We'll arrange a pickup soon.";
                        if (!copy.bankDetailsSaved) copy.needsBankDetails = true;
                        break;
                    case 'SIM_RET_PICKED':
                        copy.journeyMode = 'RETURN';
                        copy.stepperSteps = ['Return Requested', 'Picked Up', 'Received', 'Refund Processed'];
                        copy.stepIndex = 1; copy.bannerClass = 'banner-red'; copy.bannerIcon = '🚚'; copy.bannerTitle = 'Return Picked Up'; copy.bannerMessage = "Your item is on its way to us. Your refund will be processed once we receive the item.";
                        break;
                    case 'SIM_RET_REC':
                        copy.journeyMode = 'RETURN';
                        copy.stepperSteps = ['Return Requested', 'Picked Up', 'Received', 'Refund Processed'];
                        copy.stepIndex = 2; copy.bannerClass = 'banner-amber'; copy.bannerIcon = '📦'; copy.bannerTitle = 'Return Received'; copy.bannerMessage = "Your return has reached us. Your refund is now being processed.";
                        break;
                    case 'SIM_RET_REFUNDED':
                        copy.journeyMode = 'RETURN';
                        copy.stepperSteps = ['Return Requested', 'Picked Up', 'Received', 'Refund Processed'];
                        copy.stepIndex = 3; copy.bannerClass = 'banner-green'; copy.bannerIcon = '✅'; copy.bannerTitle = 'Refund Processed'; copy.bannerMessage = `₹${copy.amount || 1699} has been refunded successfully.`;
                        copy.bankDetailsSaved = { maskedAcc: '4821', ifsc: 'HDFC0001234' };
                        break;
                    case 'SIM_EXC_REQ':
                        copy.journeyMode = 'EXCHANGE'; copy.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                        copy.stepIndex = 0; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '🔄'; copy.bannerTitle = 'Exchange Requested'; copy.bannerMessage = 'Exchange confirmed. Pickup will be arranged soon.'; copy.exchangeNewSize = '34';
                        break;
                    case 'SIM_EXC_PICKED':
                        copy.journeyMode = 'EXCHANGE'; copy.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                        copy.stepIndex = 1; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '🚚'; copy.bannerTitle = 'Exchange Item Picked Up'; copy.bannerMessage = 'Your original item is on its way back to us.'; copy.exchangeNewSize = '34';
                        break;
                    case 'SIM_EXC_REC':
                        copy.journeyMode = 'EXCHANGE'; copy.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                        copy.stepIndex = 2; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '📦'; copy.bannerTitle = 'Exchange Item Received'; copy.bannerMessage = 'We have received your item. Preparing replacement size 34.'; copy.exchangeNewSize = '34';
                        break;
                    case 'SIM_EXC_SHIPPED':
                        copy.journeyMode = 'EXCHANGE'; copy.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                        copy.stepIndex = 3; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '🚚'; copy.bannerTitle = 'Exchange Shipped'; copy.bannerMessage = 'Your replacement trousers are on the way.'; copy.exchangeNewSize = '34';
                        break;
                    case 'SIM_EXC_DELIVERED':
                        copy.journeyMode = 'EXCHANGE'; copy.stepperSteps = ['Exchange Requested', 'Picked Up', 'Received', 'Exchange Shipped', 'Delivered'];
                        copy.stepIndex = 4; copy.bannerClass = 'banner-green'; copy.bannerIcon = '✓'; copy.bannerTitle = 'Exchange Delivered'; copy.bannerMessage = 'Your replacement trousers have been delivered. We hope they fit perfectly.'; copy.exchangeNewSize = '34';
                        break;
                    case 'SIM_ALT_REQ':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 0; copy.bannerClass = 'banner-amber'; copy.bannerIcon = '✂️'; copy.bannerTitle = 'Alteration Requested'; copy.bannerMessage = "We'll arrange a pickup for your trousers."; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_PICKED':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 1; copy.bannerClass = 'banner-amber'; copy.bannerIcon = '🚚'; copy.bannerTitle = 'Picked Up'; copy.bannerMessage = 'Your trousers have been picked up and are on their way to us.'; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_REC':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 2; copy.bannerClass = 'banner-amber'; copy.bannerIcon = '🏢'; copy.bannerTitle = 'Received at Slyte'; copy.bannerMessage = "We've received your trousers. Your alteration is now in progress."; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_INPROG':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 3; copy.bannerClass = 'banner-amber'; copy.bannerIcon = '✂️'; copy.bannerTitle = 'Alteration in Progress'; copy.bannerMessage = 'Our team is working on your trousers. Expected completion: 3 business days.'; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_DONE':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 4; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '✨'; copy.bannerTitle = 'Alteration Completed'; copy.bannerMessage = 'Your trousers have been altered and are ready to ship.'; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_SHIPPED':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 5; copy.bannerClass = 'banner-blue'; copy.bannerIcon = '🚚'; copy.bannerTitle = 'Alteration Shipped'; copy.bannerMessage = 'Your altered trousers are on the way.'; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                    case 'SIM_ALT_DELIVERED':
                        copy.journeyMode = 'ALTERATION'; copy.stepperSteps = ['Requested', 'Picked Up', 'Received', 'In Progress', 'Completed', 'Shipped', 'Delivered'];
                        copy.stepIndex = 6; copy.bannerClass = 'banner-green'; copy.bannerIcon = '✓'; copy.bannerTitle = 'Alteration Delivered'; copy.bannerMessage = 'Your altered trousers have been delivered. We hope they fit perfectly.'; copy.alterationSpecs = { waist: '31"', length: '39"' };
                        break;
                }
                return copy;
            }

            // Stepper Component Renderer
            function renderJourneyStepper(mode, activeIndex, steps) {
                if (!steps || !steps.length) return '';
                return `
                <div class="timeline-stepper">
                    ${steps.map((label, idx) => {
                        let stateClass = '';
                        if (idx < activeIndex) stateClass = 'done';
                        else if (idx === activeIndex) {
                            if (mode === 'RETURN' && activeIndex === 3) stateClass = 'active-green';
                            else if (mode === 'ALTERATION' && activeIndex === 3) stateClass = 'active-amber';
                            else stateClass = 'active';
                        }
                        return `
                        <div class="step-node ${stateClass}">
                            <div class="node-circle">${idx < activeIndex ? '✓' : (idx + 1)}</div>
                            <div class="node-label">${label}</div>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            // Contextual Action Buttons Resolver
            function renderContextualActions(mode, order) {
                const isCustom = order.productType === 'CUSTOM' || (order.fitType || '').toLowerCase().includes('custom');
                const isTerminalSuccess = (mode === 'RETURN' && order.stepIndex === 3) ||
                                          (mode === 'EXCHANGE' && order.stepIndex === 4) ||
                                          (mode === 'ALTERATION' && order.stepIndex === 6);

                if (isTerminalSuccess) {
                    return `
                    <div class="btn-row">
                        <a href="custom-clothing.html" class="btn-action btn-primary">Shop Again</a>
                        <a href="https://wa.me/916363887497" target="_blank" class="btn-action btn-secondary">Need Help?</a>
                    </div>`;
                }

                if (mode === 'RETURN') {
                    return `
                    <div class="btn-row">
                        <button class="btn-action btn-outline-blue" onclick="toggleDetails('${esc(order.orderId)}')">View Return Details</button>
                        <a href="https://shiprocket.co/tracking/${esc(order.trackingNumber || 'RET-1001')}" target="_blank" class="btn-action btn-secondary">Track Return</a>
                    </div>`;
                }

                if (mode === 'EXCHANGE') {
                    return `
                    <div class="btn-row">
                        <button class="btn-action btn-outline-blue" onclick="toggleDetails('${esc(order.orderId)}')">View Exchange Details</button>
                        <a href="https://shiprocket.co/tracking/${esc(order.trackingNumber || 'EXC-1001')}" target="_blank" class="btn-action btn-secondary">Track Exchange</a>
                    </div>`;
                }

                if (mode === 'ALTERATION') {
                    return `
                    <div class="btn-row">
                        <button class="btn-action btn-outline-purple" onclick="toggleDetails('${esc(order.orderId)}')">View Alteration Details</button>
                        <a href="https://shiprocket.co/tracking/${esc(order.trackingNumber || 'ALT-1001')}" target="_blank" class="btn-action btn-secondary">Track Pickup</a>
                    </div>`;
                }

                // Default Normal Delivered Order Actions
                if (isCustom) {
                    return `
                    <button class="btn-action btn-primary" style="background:#673ab7;" onclick="openAlterationModal('${esc(order.orderId)}', '${esc(order.productName)}')">
                        ✂️ Request Custom Alteration
                    </button>`;
                }

                return `
                <div class="btn-row">
                    <button class="btn-action btn-outline-blue" onclick="openReturnModal('${esc(order.orderId)}')">↩ Request Return</button>
                    <button class="btn-action btn-outline-green" onclick="openExchangeModal('${esc(order.orderId)}')">🔄 Request Exchange</button>
                </div>`;
            }

            // Expanded Details Section Renderer (Dynamic based on Journey Mode)
            function renderExpandedDetails(mode, order) {
                const addr = order.deliveryAddress || {};
                const addrStr = `${esc(addr.addressLine1 || '123 Test Street')}, ${esc(addr.city || 'Bengaluru')}, ${esc(addr.pincode || '560034')}`;

                let timelineSpecificHtml = '';

                if (mode === 'NORMAL') {
                    timelineSpecificHtml = `
                    <div class="section-header-title">Delivery Timeline</div>
                    <div class="detail-box">
                        <div class="detail-box-row"><span>Order Placed</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                        <div class="detail-box-row"><span>Dispatched</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                        <div class="detail-box-row"><span>Delivered</span><span style="font-weight:700; color:#166534;">Confirmed</span></div>
                    </div>`;
                } else if (mode === 'RETURN') {
                    const bank = order.bankDetailsSaved || { maskedAcc: '4821', ifsc: 'HDFC0001234' };
                    timelineSpecificHtml = `
                    <div class="section-header-title">Return & Refund Details</div>
                    <div class="detail-box">
                        <div class="detail-box-row"><span>Return Requested On</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                        <div class="detail-box-row"><span>Refund Amount</span><span style="font-weight:800; color:#0f172a;">₹${order.amount || 1699}</span></div>
                        <div class="detail-box-row"><span>Refund Method</span><span style="font-weight:700;">Bank Account</span></div>
                        <div class="detail-box-row"><span>Bank Account</span><span style="font-weight:700;">•••• ${esc(bank.maskedAcc)}</span></div>
                        <div class="detail-box-row"><span>IFSC Code</span><span style="font-weight:700;">${esc(bank.ifsc)}</span></div>
                        <div class="detail-box-row"><span>Refund Status</span><span style="font-weight:700; color:${order.stepIndex === 3 ? '#166534' : '#d97706'};">${order.stepIndex === 3 ? 'Processed Successfully' : 'In Progress (Post-Receipt)'}</span></div>
                    </div>`;
                } else if (mode === 'EXCHANGE') {
                    timelineSpecificHtml = `
                    <div class="section-header-title">Exchange Details</div>
                    <div class="detail-box">
                        <div class="detail-box-row"><span>Exchange Requested On</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                        <div class="detail-box-row"><span>Original Size</span><span style="font-weight:700;">Size ${esc(order.size || '32')}</span></div>
                        <div class="detail-box-row"><span>New Requested Size</span><span style="font-weight:800; color:#2563eb;">Size ${esc(order.exchangeNewSize || '34')}</span></div>
                        <div class="detail-box-row"><span>Tracking AWB</span><span style="font-weight:700;">EXC-${esc(order.orderId)}</span></div>
                    </div>`;
                } else if (mode === 'ALTERATION') {
                    const alt = order.alterationSpecs || { waist: '31"', length: '39"' };
                    timelineSpecificHtml = `
                    <div class="section-header-title">Alteration Measurement Changes</div>
                    <div class="detail-box">
                        <div class="detail-box-row"><span>Alteration Requested On</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                        <div class="detail-box-row"><span>Waist Adjustment</span><span style="font-weight:700;">32" → ${esc(alt.waist)}</span></div>
                        <div class="detail-box-row"><span>Length Adjustment</span><span style="font-weight:700;">40" → ${esc(alt.length)}</span></div>
                        <div class="detail-box-row"><span>Alteration Fee</span><span style="font-weight:800; color:#166534;">Included (Free)</span></div>
                    </div>`;
                }

                return `
                <div class="section-header-title">Order Information</div>
                <div class="detail-box">
                    <div class="detail-box-row"><span>Order ID</span><span style="font-weight:700;">${esc(order.orderId)}</span></div>
                    <div class="detail-box-row"><span>Payment Mode</span><span style="font-weight:700;">${esc(order.paymentGroup || 'Cashfree UPI')}</span></div>
                    <div class="detail-box-row"><span>Ordered Date & Time</span><span style="font-weight:700;">${fmtDate(order.createdAt)}</span></div>
                    <div class="detail-box-row" style="flex-direction:column; gap:4px; margin-top:6px;">
                        <span>Delivery Address</span>
                        <span style="font-weight:600; color:var(--navy-primary); line-height:1.4;">${addrStr}</span>
                    </div>
                </div>
                ${timelineSpecificHtml}`;
            }

            // Expand Details Toggle Function
            window.toggleDetails = function(orderId) {
                const panel = document.getElementById(`expand-${orderId}`);
                const btn = document.getElementById(`btn-toggle-${orderId}`);
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                    btn.textContent = 'Show Details ▼';
                } else {
                    panel.style.display = 'block';
                    btn.textContent = 'Hide Details ▲';
                }
            };

            // Modal Management
            window.closeModal = function() {
                document.getElementById('modalOverlay').style.display = 'none';
            };

            // 1. Dedicated Bank Details Modal
            window.openBankDetailsModal = function(orderId) {
                const overlay = document.getElementById('modalOverlay');
                const body = document.getElementById('modalBody');

                const saved = localStorage.getItem(`bank_${orderId}`);
                let existingName = '', existingAcc = '', existingIfsc = '';
                if (saved) {
                    try {
                        const p = JSON.parse(saved);
                        existingName = p.account_name || '';
                        existingAcc = p.account_number || '';
                        existingIfsc = p.ifsc_code || '';
                    } catch(e){}
                }

                body.innerHTML = `
                    <div class="modal-title">Refund Bank Details</div>
                    <div class="modal-subtitle">Add your bank account details so we can process your refund once the return is received.</div>
                    
                    <div class="form-group">
                        <label class="form-label">Account Holder Name *</label>
                        <input type="text" id="bankName" class="form-input" placeholder="Full name as in bank account" value="${esc(existingName)}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bank Account Number *</label>
                        <input type="password" id="bankAcc" class="form-input" placeholder="Enter account number" value="${esc(existingAcc)}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Account Number *</label>
                        <input type="text" id="bankAccConfirm" class="form-input" placeholder="Re-enter account number" value="${esc(existingAcc)}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">IFSC Code *</label>
                        <input type="text" id="bankIfsc" class="form-input" style="text-transform:uppercase;" placeholder="e.g. HDFC0001234" maxlength="11" value="${esc(existingIfsc)}">
                    </div>

                    <div class="form-disclaimer">
                        <span class="material-symbols-outlined" style="font-size:16px;">lock</span>
                        Your bank details are used only to process your refund.
                    </div>

                    <div id="modalErr" style="display:none; color:var(--red-text); font-size:13px; font-weight:700; margin-top:12px;"></div>

                    <button class="btn-action btn-primary" style="width:100%; margin-top:16px;" onclick="saveBankDetails('${esc(orderId)}')">
                        Save Bank Details
                    </button>`;
                overlay.style.display = 'flex';
            };

            window.saveBankDetails = async function(orderId) {
                const name = document.getElementById('bankName').value.trim();
                const acc = document.getElementById('bankAcc').value.trim();
                const confirmAcc = document.getElementById('bankAccConfirm').value.trim();
                const ifsc = document.getElementById('bankIfsc').value.trim().toUpperCase();
                const errBox = document.getElementById('modalErr');

                if (!name) { errBox.textContent = 'Account holder name is required.'; errBox.style.display = 'block'; return; }
                if (!acc || acc.length < 8) { errBox.textContent = 'Please enter a valid bank account number.'; errBox.style.display = 'block'; return; }
                if (acc !== confirmAcc) { errBox.textContent = 'Confirm Account Number does not match.'; errBox.style.display = 'block'; return; }
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) { errBox.textContent = 'Please enter a valid 11-digit IFSC code (e.g. HDFC0001234).'; errBox.style.display = 'block'; return; }

                errBox.style.display = 'none';

                const bankObj = { account_name: name, account_number: acc, ifsc_code: ifsc };
                localStorage.setItem(`bank_${orderId}`, JSON.stringify(bankObj));

                try {
                    await fetch(`${API_BASE}/api/after-sales/return`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: orderId, bank_details: bankObj })
                    });
                } catch(e){}

                closeModal();
                fetchOrders();
            };

            // 2. Return Modal Handler
            window.openReturnModal = function(orderId) {
                const overlay = document.getElementById('modalOverlay');
                const body = document.getElementById('modalBody');
                body.innerHTML = `
                    <div class="modal-title">Request Return</div>
                    <div class="modal-subtitle">Order #${orderId} • Standard Fit Return</div>
                    
                    <div class="form-group">
                        <label class="form-label">Reason for Return</label>
                        <select id="retReason" class="form-select">
                            <option value="Size issue">Size issue / fit not comfortable</option>
                            <option value="Quality issue">Fabric or quality issue</option>
                            <option value="Color mismatch">Color different than expected</option>
                            <option value="Changed mind">Changed mind</option>
                        </select>
                    </div>

                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:14px; margin-bottom:14px;">
                        <div style="font-size:13px; font-weight:800; color:#0f172a; margin-bottom:8px;">Refund Bank Details</div>
                        <div class="form-group">
                            <label class="form-label">Account Holder Name *</label>
                            <input type="text" id="retAccName" class="form-input" placeholder="Full name">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Account Number *</label>
                            <input type="password" id="retAccNum" class="form-input" placeholder="Account number">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Confirm Account Number *</label>
                            <input type="text" id="retConfirmAccNum" class="form-input" placeholder="Confirm account number">
                        </div>
                        <div class="form-group">
                            <label class="form-label">IFSC Code *</label>
                            <input type="text" id="retIfsc" class="form-input" style="text-transform:uppercase;" placeholder="e.g. HDFC0001234" maxlength="11">
                        </div>
                        <div class="form-disclaimer">Your bank details are used only to process your refund.</div>
                    </div>

                    <div id="modalErr" style="display:none; color:var(--red-text); font-size:13px; font-weight:700; margin-bottom:12px;"></div>

                    <button class="btn-action btn-primary" style="width:100%;" onclick="submitReturn('${esc(orderId)}')">
                        Submit Return Request
                    </button>`;
                overlay.style.display = 'flex';
            };

            window.submitReturn = async function(orderId) {
                const reason = document.getElementById('retReason').value;
                const name = document.getElementById('retAccName').value.trim();
                const acc = document.getElementById('retAccNum').value.trim();
                const confirmAcc = document.getElementById('retConfirmAccNum').value.trim();
                const ifsc = document.getElementById('retIfsc').value.trim().toUpperCase();
                const errBox = document.getElementById('modalErr');

                if (!name) { errBox.textContent = 'Account holder name is required.'; errBox.style.display = 'block'; return; }
                if (!acc || acc.length < 8) { errBox.textContent = 'Please enter a valid bank account number.'; errBox.style.display = 'block'; return; }
                if (acc !== confirmAcc) { errBox.textContent = 'Confirm Account Number does not match.'; errBox.style.display = 'block'; return; }
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) { errBox.textContent = 'Please enter a valid 11-digit IFSC code.'; errBox.style.display = 'block'; return; }

                const bankObj = { account_name: name, account_number: acc, ifsc_code: ifsc };
                localStorage.setItem(`bank_${orderId}`, JSON.stringify(bankObj));

                try {
                    await fetch(`${API_BASE}/api/after-sales/return`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: orderId, reason, bank_details: bankObj })
                    });
                } catch(e){}

                closeModal();
                fetchOrders();
            };

            // 3. Exchange Modal Handler
            window.openExchangeModal = function(orderId) {
                const overlay = document.getElementById('modalOverlay');
                const body = document.getElementById('modalBody');
                body.innerHTML = `
                    <div class="modal-title">Request Exchange</div>
                    <div class="modal-subtitle">Order #${orderId} • Standard Fit Exchange</div>
                    
                    <div class="form-group">
                        <label class="form-label">Select Replacement Size</label>
                        <select id="excSize" class="form-select">
                            <option value="28">Size 28</option>
                            <option value="30">Size 30</option>
                            <option value="32">Size 32</option>
                            <option value="34" selected>Size 34</option>
                            <option value="36">Size 36</option>
                            <option value="38">Size 38</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Reason for Exchange</label>
                        <select id="excReason" class="form-select">
                            <option value="Too small">Too small / Tight fit</option>
                            <option value="Too large">Too large / Loose fit</option>
                            <option value="Length incorrect">Length incorrect</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Additional Instructions (Optional)</label>
                        <textarea id="excNotes" class="form-textarea" placeholder="e.g. Please send size 34 in original color..."></textarea>
                    </div>

                    <button class="btn-action btn-primary" style="width:100%;" onclick="submitExchange('${esc(orderId)}')">
                        Submit Exchange Request
                    </button>`;
                overlay.style.display = 'flex';
            };

            window.submitExchange = async function(orderId) {
                const replacement_size = document.getElementById('excSize').value;
                const reason = document.getElementById('excReason').value;
                const notes = document.getElementById('excNotes').value.trim();

                try {
                    await fetch(`${API_BASE}/api/after-sales/exchange`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: orderId, replacement_size, reason, customer_notes: notes })
                    });
                } catch(e){}

                closeModal();
                fetchOrders();
            };

            // 4. Dedicated Alteration Modal Handler
            let selWaist = "0.0";
            let selLength = "0.0";

            window.openAlterationModal = function(orderId, productName) {
                selWaist = "0.0"; selLength = "0.0";
                const overlay = document.getElementById('modalOverlay');
                const body = document.getElementById('modalBody');

                body.innerHTML = `
                    <div class="modal-title">Alter Your Trousers</div>
                    <div class="modal-subtitle">We'll alter your existing Slyte trousers and send them back to you.<br><span style="color:#673ab7; font-weight:700;">Alteration included (Free up to ±1.5")</span></div>
                    
                    <div class="form-group">
                        <label class="form-label">Waist Adjustment</label>
                        <div class="adj-grid">
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'-1.5')">-1.5"</button>
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'-1.0')">-1.0"</button>
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'-0.5')">-0.5"</button>
                            <button type="button" class="adj-pill waist-pill active" onclick="setWaist(this,'0.0')">0" (Current)</button>
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'+0.5')">+0.5"</button>
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'+1.0')">+1.0"</button>
                            <button type="button" class="adj-pill waist-pill" onclick="setWaist(this,'+1.5')">+1.5"</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Length Adjustment</label>
                        <div class="adj-grid">
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'-1.5')">-1.5"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'-1.0')">-1.0"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'-0.5')">-0.5"</button>
                            <button type="button" class="adj-pill length-pill active" onclick="setLength(this,'0.0')">0" (Current)</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+0.5')">+0.5"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+1.0')">+1.0"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+1.5')">+1.5"</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Anything Else? (Optional Instructions)</label>
                        <textarea id="altNotes" class="form-textarea" placeholder="e.g. Taper slightly around calves or knee..."></textarea>
                    </div>

                    <button class="btn-action btn-primary" style="width:100%; background:#673ab7;" onclick="submitAlteration('${esc(orderId)}')">
                        Submit Alteration Request
                    </button>`;
                overlay.style.display = 'flex';
            };

            window.setWaist = function(btn, val) {
                document.querySelectorAll('.waist-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selWaist = val;
            };

            window.setLength = function(btn, val) {
                document.querySelectorAll('.length-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selLength = val;
            };

            window.submitAlteration = async function(orderId) {
                const notes = document.getElementById('altNotes').value.trim();
                try {
                    await fetch(`${API_BASE}/api/after-sales/alteration`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            order_id: orderId,
                            alteration_type: `Waist: ${selWaist}", Length: ${selLength}"`,
                            measurements: { waist_diff: selWaist, length_diff: selLength },
                            customer_notes: notes
                        })
                    });
                } catch(e){}

                closeModal();
                fetchOrders();
            };

            // Auto-lookup saved mobile number
            const savedPhone = localStorage.getItem('slyte_phone') || localStorage.getItem('userPhone');
            if (savedPhone) {
                document.getElementById('mobileInput').value = savedPhone.replace(/\D/g, '').slice(-10);
                fetchOrders();
            }

        })();
    </script>
</body>

</html>
