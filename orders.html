<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Orders — Slyte</title>
    <meta name="description" content="Look up all your Slyte custom trouser orders by entering your mobile number." />
    <meta name="robots" content="noindex, follow">

    <!-- Central Application Config -->
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/png" href="images/logos/slyte-only-logo-black.png">

    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #eeeeee;
            --border-light: #f1f5f9;
            --text-primary: #000000;
            --text-secondary: #555555;
            --text-muted: #999999;
            --accent: #154cbd;
            --accent-light: #0d3a95;
            --paid-bg: #e8f5e9;
            --paid-color: #2e7d32;
            --pending-pay-bg: #fff8e1;
            --pending-pay-color: #e65100;
            --error: #c62828;
            --radius: 16px;
            --radius-sm: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            padding-bottom: 100px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .lookup-hero {
            text-align: center;
            margin-bottom: 24px;
        }

        .lookup-hero .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .lookup-hero h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .lookup-hero p {
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .lookup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .phone-wrapper {
            flex: 1;
            position: relative;
        }

        .phone-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--text-primary);
        }

        #mobileInput {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 16px 0 50px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            background: #fafafa;
        }

        #trackBtn {
            height: 48px;
            padding: 0 20px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* Order Details Card (Matching Mockup Images 1:1) */
        .order-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-top-header .title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
        }

        .card-top-header .code {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        /* Product Hero Row */
        .product-hero-row {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .product-img-thumb {
            width: 84px;
            height: 84px;
            border-radius: 12px;
            background: #f1f5f9;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
        }

        .product-details-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-name-txt {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.25;
        }

        .fit-spec-txt {
            font-size: 13.5px;
            font-weight: 500;
            color: #64748b;
        }

        .type-badge-pill {
            display: inline-block;
            align-self: flex-start;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .badge-std { background: #eff6ff; color: #1d4ed8; }
        .badge-cst { background: #f3e8ff; color: #6b21a8; }

        /* Timeline Stepper Component */
        .stepper-timeline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            margin: 20px 0 24px 0;
            padding: 0 4px;
        }

        .stepper-track-bg {
            position: absolute;
            top: 18px;
            left: 20px;
            right: 20px;
            height: 2px;
            background: #e2e8f0;
            z-index: 1;
        }

        .stepper-track-fill {
            position: absolute;
            top: 18px;
            left: 20px;
            height: 2px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .step-item-node {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
        }

        .node-circle-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .node-circle-icon .material-symbols-outlined {
            font-size: 18px;
        }

        .step-label-txt {
            font-size: 11px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            max-width: 76px;
        }

        .step-item-node:not(.done):not(.active) .step-label-txt {
            color: #94a3b8;
            font-weight: 600;
        }

        .step-date-txt {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Status Banner Card (Red / Blue / Green matching Mockups) */
        .status-banner-card {
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .status-avatar-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-avatar-wrap .material-symbols-outlined {
            font-size: 22px;
        }

        .status-txt-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-card-title {
            font-size: 16px;
            font-weight: 800;
        }

        .status-card-desc {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            line-height: 1.4;
        }

        .status-card-time {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Color Schemes from Mockups */
        .theme-red-card { background: #fef2f2; }
        .theme-red-card .status-avatar-wrap { background: #fee2e2; color: #dc2626; }
        .theme-red-card .status-card-title { color: #dc2626; }

        .theme-blue-card { background: #eff6ff; }
        .theme-blue-card .status-avatar-wrap { background: #dbeafe; color: #2563eb; }
        .theme-blue-card .status-card-title { color: #2563eb; }

        .theme-green-card { background: #f0fdf4; }
        .theme-green-card .status-avatar-wrap { background: #dcfce7; color: #16a34a; }
        .theme-green-card .status-card-title { color: #15803d; }

        /* Details Card */
        .details-summary-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .details-summary-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .detail-row-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f8fafc;
        }

        .detail-row-line:last-child {
            border-bottom: none;
        }

        .detail-left-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }

        .detail-left-label .material-symbols-outlined {
            font-size: 18px;
            color: #64748b;
        }

        .detail-right-val {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-copy {
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 14px;
        }

        /* Info Blue Notice Box */
        .info-notice-box {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .info-notice-box .material-symbols-outlined {
            font-size: 18px;
            color: #1d4ed8;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .info-notice-box span {
            font-size: 12.5px;
            font-weight: 500;
            color: #1e40af;
            line-height: 1.4;
        }

        /* Support Row Card */
        .support-contact-row {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #0f172a;
        }

        .support-contact-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .support-headset-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
        }

        .support-contact-text h4 {
            font-size: 13.5px;
            font-weight: 800;
            color: #0f172a;
        }

        .support-contact-text p {
            font-size: 12px;
            color: #64748b;
        }

        /* Full Width Action Buttons */
        .btn-tracking-link {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .btn-action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-act {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-act-blue { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
        .btn-act-green { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .btn-act-purple { background: #673ab7; color: #ffffff; }

        .btn-show-more-toggle {
            width: 100%;
            background: none;
            border: 1px dashed #e2e8f0;
            color: #64748b;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .expanded-details-block {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
        }

        /* Preserved Fixed Bottom Navbar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 12px 0;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #0f172a;
            font-weight: 800;
        }

        .nav-item .material-symbols-outlined {
            font-size: 22px;
        }

        /* Adjustment Pills */
        .adjustment-pill {
            padding: 8px 4px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            text-align: center;
        }
        .adjustment-pill.active {
            background: #154cbd;
            color: #ffffff;
            border-color: #154cbd;
        }
    </style>
</head>

<body>

    <!-- Preserved Header Navbar -->
    <header class="brand-header" style="background:#fff; border-bottom:1px solid #e2e8f0; padding:16px; position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between;">
        <a href="index.html" class="brand-logo" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:#0f172a;">
            <img src="images/logos/slyte-logo-black.png" alt="Slyte Logo" style="height:24px;">
        </a>
        <a href="https://wa.me/916363887497" target="_blank" class="header-help-btn" style="font-size:13px; font-weight:600; color:#64748b; text-decoration:none; display:flex; align-items:center; gap:4px; padding:6px 12px; border-radius:20px; background:#f8fafc; border:1px solid #f1f5f9;">
            <span class="material-symbols-outlined" style="font-size:16px">help_outline</span> Need Help?
        </a>
    </header>

    <div class="page-container">
        <!-- Phone Lookup Card -->
        <div class="lookup-card">
            <div class="field-label">Lookup Orders</div>
            <p style="font-size:13px; color:#555; margin-bottom:14px;">Enter your 10-digit mobile number to track orders and manage returns/exchanges/alterations.</p>
            <div class="input-row">
                <div class="phone-wrapper">
                    <span class="phone-prefix">+91</span>
                    <input type="tel" id="mobileInput" placeholder="97420 06683" maxlength="10">
                </div>
                <button id="trackBtn" onclick="fetchOrders()">Look Up</button>
            </div>
        </div>

        <!-- Orders Results Container -->
        <div id="resultsArea">
            <div style="text-align:center; padding:30px; color:var(--text-muted); font-size:14px;">
                Enter your phone number above to view orders.
            </div>
        </div>
    </div>

    <!-- Preserved Bottom Fixed Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>
        <a href="custom-clothing.html" class="nav-item">
            <span class="material-symbols-outlined">search</span>
            <span>Shop</span>
        </a>
        <a href="orders.html" class="nav-item active">
            <span class="material-symbols-outlined">local_shipping</span>
            <span>Orders</span>
        </a>
        <a href="complete-profile.html" class="nav-item">
            <span class="material-symbols-outlined">person</span>
            <span>Account</span>
        </a>
    </nav>

    <!-- Modal Overlay -->
    <div id="afterSalesModalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.6); z-index:9999; backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:16px;">
        <div style="background:#fff; border-radius:20px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 20px 40px rgba(0,0,0,0.2); position:relative; font-family:inherit;">
            <button onclick="closeAfterSalesModal()" style="position:absolute; top:16px; right:16px; background:#f0f0f0; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; font-weight:700; cursor:pointer; color:#333;">✕</button>
            <div id="afterSalesModalContent">
                <!-- Modal Content Injected Dynamically -->
            </div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = (window.SLYTE_API_BASE || window.SLYTE_CONFIG?.API_BASE_URL || 'https://api.slyte.in').replace(/\/+$/, '');
            let currentOrders = [];

            function esc(s) {
                return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmtDate(dStr) {
                if (!dStr) return '14 Sep 2025';
                const d = new Date(dStr);
                return isNaN(d.getTime()) ? dStr : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            window.fetchOrders = async function () {
                const phoneInput = document.getElementById('mobileInput');
                const resultsArea = document.getElementById('resultsArea');
                const rawPhone = phoneInput.value.replace(/\D/g, '').slice(-10);

                if (rawPhone.length < 10) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:20px; color:#c62828; font-weight:600;">Please enter a valid 10-digit mobile number.</div>`;
                    return;
                }

                localStorage.setItem('slyte_phone', rawPhone);
                resultsArea.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b; font-size:14px;">Loading your orders...</div>`;

                try {
                    const token = localStorage.getItem('slyte_otp_token');
                    const res = await fetch(`${API_BASE}/orders/lookup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({ phone: rawPhone })
                    });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.orders)) {
                        currentOrders = data.orders;
                        renderOrders(currentOrders);
                    } else {
                        resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:#64748b; font-size:14px;">No orders found for +91 ${rawPhone}.</div>`;
                    }
                } catch (err) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:#c62828; font-size:14px;">Could not connect to server. Please try again.</div>`;
                }
            };

            function resolveOrderJourney(order) {
                const lcs = (order.orderLifecycleStatus || 'DELIVERED').toUpperCase();
                const isCustom = order.productType === 'CUSTOM' || (order.fitType || '').toLowerCase().includes('custom');
                
                let mode = 'NORMAL';
                if (['RETURN_INITIATED', 'RTO_IN_TRANSIT', 'RTO_DELIVERED', 'REFUNDED'].includes(lcs)) mode = 'RETURN';
                else if (lcs.startsWith('EXCHANGE_')) mode = 'EXCHANGE';
                else if (lcs.startsWith('ALTERATION_')) mode = 'ALTERATION';

                let stepperSteps = [];
                let stepIndex = 0;
                let themeClass = 'theme-delivered';
                let statusIcon = 'check_circle';
                let bannerTitle = 'Delivered';
                let bannerMessage = 'Enjoy your order.';
                let infoText = 'Includes 7-day return/exchange window and custom alterations.';
                let trackingId = order.trackingNumber || 'SR123456789';

                if (mode === 'RETURN') {
                    themeClass = 'theme-red-card';
                    stepperSteps = [
                        { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                        { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                        { label: 'Refund Processing', date: '', icon: 'currency_rupee' },
                        { label: 'Refunded', date: '', icon: 'check' }
                    ];
                    infoText = 'Once we receive your return at our warehouse, your refund will be processed automatically.';

                    if (lcs === 'RETURN_INITIATED') {
                        stepIndex = 0; statusIcon = 'package_2'; bannerTitle = 'Return Requested'; bannerMessage = "Your return request has been confirmed. We'll arrange a pickup soon.";
                    } else if (lcs === 'RTO_IN_TRANSIT') {
                        stepIndex = 1; statusIcon = 'local_shipping'; bannerTitle = 'Picked Up'; bannerMessage = 'Your return has been picked up and is on its way to our warehouse.';
                    } else if (lcs === 'RTO_DELIVERED') {
                        stepIndex = 2; statusIcon = 'inventory_2'; bannerTitle = 'Return Received'; bannerMessage = 'Your return has reached us. Your refund is now being processed.';
                    } else if (lcs === 'REFUNDED') {
                        stepIndex = 3; statusIcon = 'check_circle'; bannerTitle = 'Refund Processed'; bannerMessage = `₹${order.amount || 1699} has been refunded successfully to your bank account.`;
                    }
                } else if (mode === 'EXCHANGE') {
                    themeClass = 'theme-blue-card';
                    stepperSteps = [
                        { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                        { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                        { label: 'Exchange Shipped', date: '', icon: 'warehouse' },
                        { label: 'Delivered', date: '', icon: 'check' }
                    ];
                    infoText = "Once we receive your return at our warehouse, we'll ship your exchange item.";

                    if (lcs === 'EXCHANGE_REQUESTED') {
                        stepIndex = 0; statusIcon = 'package_2'; bannerTitle = 'Exchange Requested'; bannerMessage = 'Exchange confirmed. Replacement size will be prepared upon pickup.';
                    } else if (lcs === 'EXCHANGE_PICKED_UP') {

            function renderStepperTimeline(mode, activeIndex, steps) {
                if (!steps || !steps.length) return '';
                const total = steps.length;
                const percent = Math.min(100, Math.max(0, (activeIndex / (total - 1)) * 100));

                let themeColor = '#dc2626';
                if (mode === 'EXCHANGE') themeColor = '#2563eb';
                else if (mode === 'ALTERATION') themeColor = '#16a34a';
                else if (mode === 'NORMAL') themeColor = '#16a34a';

                return `
                <div class="stepper-timeline">
                    <div class="stepper-track-bg"></div>
                    <div class="stepper-track-fill" style="width: calc(${percent}% - 20px); background: ${themeColor};"></div>
                    ${steps.map((s, idx) => {
                        const isDoneOrActive = idx <= activeIndex;
                        const circleBg = isDoneOrActive ? themeColor : '#ffffff';
                        const iconColor = isDoneOrActive ? '#ffffff' : '#94a3b8';

                        return `
                        <div class="step-item-node ${idx < activeIndex ? 'done' : idx === activeIndex ? 'active' : ''}">
                            <div class="node-circle-icon" style="background:${circleBg}; border-color:${isDoneOrActive ? 'transparent' : '#e2e8f0'}; color:${iconColor};">
                                <span class="material-symbols-outlined">${s.icon || 'check'}</span>
                            </div>
                            <div class="step-label-txt">${s.label}</div>
                            ${s.date ? `<div class="step-date-txt">${s.date}</div>` : ''}
                        </div>`;
                    }).join('')}
                </div>`;
            }

            window.submitReturnRequest = async function(orderId) {
                const btn = document.getElementById('btnSubmitRet');
                const msg = document.getElementById('modalMsg');
                const reason = document.getElementById('returnReason').value;
                const accountName = (document.getElementById('returnAccountName').value || '').trim();
                const accountNumber = (document.getElementById('returnAccountNumber').value || '').trim();
                const confirmAccountNumber = (document.getElementById('returnConfirmAccountNumber').value || '').trim();
                const ifscCode = (document.getElementById('returnIfscCode').value || '').trim().toUpperCase();

                if (!accountName) { msg.style.display='block'; msg.style.background='#fee2e2'; msg.style.color='#991b1b'; msg.innerHTML='⚠️ Please enter Account Holder Name.'; return; }
                if (!accountNumber || accountNumber.length < 8) { msg.style.display='block'; msg.style.background='#fee2e2'; msg.style.color='#991b1b'; msg.innerHTML='⚠️ Please enter a valid Account Number.'; return; }
                if (accountNumber !== confirmAccountNumber) { msg.style.display='block'; msg.style.background='#fee2e2'; msg.style.color='#991b1b'; msg.innerHTML='⚠️ Account Numbers do not match.'; return; }
                if (!ifscCode || ifscCode.length !== 11) { msg.style.display='block'; msg.style.background='#fee2e2'; msg.style.color='#991b1b'; msg.innerHTML='⚠️ Please enter a valid 11-digit IFSC Code.'; return; }

                btn.disabled = true; btn.innerHTML = 'Submitting...';
                try {
                    const res = await fetch(API_BASE + '/api/after-sales/return', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            order_id: orderId, reason, bank_details: { account_name: accountName, account_number: accountNumber, ifsc_code: ifscCode }
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        msg.style.display = 'block'; msg.style.background = '#dcfce7'; msg.style.color = '#166534';
                        msg.innerHTML = '✓ Return request submitted! Pickup will be scheduled.';
                        setTimeout(() => { closeAfterSalesModal(); fetchOrders(); }, 1800);
                    } else {
                        msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                        msg.innerHTML = '❌ ' + (data.error || 'Failed to submit return request.');
                        btn.disabled = false; btn.innerHTML = 'Submit Return Request';
                    }
                } catch (err) {
                    msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                    msg.innerHTML = '❌ Network error submitting return request.';
                    btn.disabled = false; btn.innerHTML = 'Submit Return Request';
                }
            };

                    if (data.success) {
                        msg.style.display = 'block'; msg.style.background = '#dcfce7'; msg.style.color = '#166534';
                        msg.innerHTML = '✓ Exchange request submitted! Replacement will be dispatched.';
                        setTimeout(() => { closeAfterSalesModal(); fetchOrders(); }, 1800);
                    } else {
                        msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                        msg.innerHTML = '❌ ' + (data.error || 'Failed to submit exchange request.');
                        btn.disabled = false; btn.innerHTML = 'Submit Exchange Request';
                    }
                } catch (err) {
                    msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                    msg.innerHTML = '❌ Network error submitting exchange request.';
                    btn.disabled = false; btn.innerHTML = 'Submit Exchange Request';
                }
            };

            let selectedWaistVal = "0.0";
            let selectedLengthVal = "0.0";

            window.openAlterationModal = function(orderId, productName) {
                selectedWaistVal = "0.0"; selectedLengthVal = "0.0";
                const overlay = document.getElementById('afterSalesModalOverlay');
                const content = document.getElementById('afterSalesModalContent');
                content.innerHTML = `
                    <h2 style="font-size:20px; font-weight:800; margin-bottom:4px; color:#111;">✂️ Request Custom Alteration</h2>
                    <p style="font-size:13px; color:#666; margin-bottom:20px;">Order #${orderId} • Free alteration up to ±1.5"</p>
                    
                    <div style="margin-bottom:16px;">
                        <label style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; color:#444; margin-bottom:6px;">Waist Adjustment</label>
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'-1.5')">-1.5"</button>
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'-1.0')">-1.0"</button>
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'-0.5')">-0.5"</button>
                            <button type="button" class="adjustment-pill waist-pill active" onclick="selectWaist(this,'0.0')">0"</button>
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'+0.5')">+0.5"</button>
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'+1.0')">+1.0"</button>
                            <button type="button" class="adjustment-pill waist-pill" onclick="selectWaist(this,'+1.5')">+1.5"</button>
                        </div>
                    </div>

                    <div style="margin-bottom:16px;">
                        <label style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; color:#444; margin-bottom:6px;">Length Adjustment</label>
                        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'-1.5')">-1.5"</button>
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'-1.0')">-1.0"</button>
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'-0.5')">-0.5"</button>
                            <button type="button" class="adjustment-pill length-pill active" onclick="selectLength(this,'0.0')">0"</button>
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'+0.5')">+0.5"</button>
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'+1.0')">+1.0"</button>
                            <button type="button" class="adjustment-pill length-pill" onclick="selectLength(this,'+1.5')">+1.5"</button>
                        </div>
                    </div>

                    <div id="modalMsg" style="display:none; padding:10px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:12px;"></div>
                    <button id="btnSubmitAlt" onclick="submitAlterationRequest('${orderId}')" style="width:100%; background:#673ab7; color:#fff; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:800; cursor:pointer;">Submit Alteration Request</button>
                `;
                overlay.style.display = 'flex';
            };

            window.selectWaist = function(btn, val) {
                document.querySelectorAll('.waist-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); selectedWaistVal = val;
            };

            window.selectLength = function(btn, val) {
                document.querySelectorAll('.length-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); selectedLengthVal = val;
            };

            window.submitAlterationRequest = async function(orderId) {
                const btn = document.getElementById('btnSubmitAlt');
                const msg = document.getElementById('modalMsg');
                btn.disabled = true; btn.innerHTML = 'Submitting...';
                try {
                    const res = await fetch(API_BASE + '/api/after-sales/alteration', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            order_id: orderId,
                            alteration_type: `Waist: ${selectedWaistVal}", Length: ${selectedLengthVal}"`,
                            measurements: { waist_diff: selectedWaistVal, length_diff: selectedLengthVal }
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        msg.style.display = 'block'; msg.style.background = '#dcfce7'; msg.style.color = '#166534';
                        msg.innerHTML = '✓ Alteration request submitted! Pickup will be arranged.';
                        setTimeout(() => { closeAfterSalesModal(); fetchOrders(); }, 1800);
                    } else {
                        msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                        msg.innerHTML = '❌ ' + (data.error || 'Failed to submit alteration request.');
                        btn.disabled = false; btn.innerHTML = 'Submit Alteration Request';
                    }
                } catch (err) {
                    msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
                    msg.innerHTML = '❌ Network error submitting alteration request.';
                    btn.disabled = false; btn.innerHTML = 'Submit Alteration Request';
                }
            };

            const savedPhone = localStorage.getItem('slyte_phone') || localStorage.getItem('userPhone');
            if (savedPhone) {
                document.getElementById('mobileInput').value = savedPhone.replace(/\D/g, '').slice(-10);
                fetchOrders();
            }

        })();
    </script>
</body>

</html>
