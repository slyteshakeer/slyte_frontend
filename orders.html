<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders & After-Sales — Slyte</title>
    <meta name="description" content="Manage your Slyte trouser orders, track delivery, request returns, exchanges, or custom fit alterations." />
    <meta name="robots" content="noindex, follow">

    <!-- Central Application Config -->
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/png" href="images/logos/slyte-only-logo-black.png">

    <style>
        :root {
            --bg-body: #fafafa;
            --surface: #ffffff;
            --surface-subtle: #f8fafc;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            
            --navy-primary: #0f172a;
            --navy-secondary: #1e293b;
            --navy-accent: #2563eb;
            --navy-muted: #64748b;
            
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;

            /* Journey Colors */
            --return-theme: #dc2626;
            --return-bg: #fef2f2;
            --return-icon-bg: #fee2e2;

            --exchange-theme: #2563eb;
            --exchange-bg: #eff6ff;
            --exchange-icon-bg: #dbeafe;

            --alteration-theme: #16a34a;
            --alteration-bg: #f0fdf4;
            --alteration-icon-bg: #dcfce7;

            --radius-card: 20px;
            --radius-inner: 14px;
            --shadow-subtle: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
            --shadow-modal: 0 24px 48px -12px rgba(15, 23, 42, 0.2);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Header Navbar (Preserved) */
        .brand-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--navy-primary);
        }

        .brand-logo img {
            height: 24px;
            width: auto;
        }

        .header-help-btn {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--surface-subtle);
            border: 1px solid var(--border-light);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Phone Lookup Hero */
        .lookup-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
        }

        .lookup-card h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy-primary);
            margin-bottom: 4px;
        }

        .lookup-card p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .phone-input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .phone-prefix {
            position: absolute;
            left: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy-primary);
            pointer-events: none;
        }

        #mobileInput {
            width: 100%;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: var(--radius-inner);
            padding: 0 12px 0 46px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            background: var(--surface-subtle);
        }

        #trackBtn {
            height: 46px;
            padding: 0 18px;
            background: var(--navy-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-inner);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Test Journey Simulator Bar */
        .scenario-bar {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-inner);
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .scenario-bar label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .scenario-select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            outline: none;
            cursor: pointer;
        }

        /* Order Details Card (Main Wrapper matching Mockup) */
        .order-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 20px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 20px;
        }

        /* Order Header Row */
        .order-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .order-top-header .title {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy-primary);
        }

        .order-top-header .code {
            font-size: 13px;
            font-weight: 600;
            color: var(--navy-muted);
        }

        /* Product Header Block (Mockup matching) */
        .product-hero-block {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }

        .product-thumb {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            background: #f1f5f9;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
        }

        .product-info-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy-primary);
            line-height: 1.25;
        }

        .fit-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--navy-muted);
        }

        .type-badge {
            display: inline-block;
            align-self: flex-start;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .badge-standard { background: #eff6ff; color: #1d4ed8; }
        .badge-custom { background: #f3e8ff; color: #6b21a8; }

        /* Timeline Stepper (Mockup matching exact layout & icons) */
        .timeline-stepper {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            margin: 20px 0 24px 0;
            padding: 0 4px;
        }

        .timeline-line-bg {
            position: absolute;
            top: 18px;
            left: 24px;
            right: 24px;
            height: 2px;
            background: #e2e8f0;
            z-index: 1;
        }

        .timeline-line-progress {
            position: absolute;
            top: 18px;
            left: 24px;
            height: 2px;
            z-index: 2;
            transition: var(--transition);
        }

        .step-node {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
        }

        .node-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .node-circle .material-symbols-outlined {
            font-size: 18px;
        }

        .step-node.done .node-circle {
            color: #ffffff;
            border-color: transparent;
        }

        .step-node.active .node-circle {
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.15);
        }

        .node-label {
            font-size: 11px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.2;
            max-width: 76px;
        }

        .step-node:not(.done):not(.active) .node-label {
            color: #94a3b8;
            font-weight: 600;
        }

        .node-date {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 2px;
        }

        /* Status Banner Card (Soft Colored background with circular icon) */
        .status-card {
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .status-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-icon-box .material-symbols-outlined {
            font-size: 22px;
        }

        .status-card-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .status-card-title {
            font-size: 16px;
            font-weight: 800;
        }

        .status-card-desc {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            line-height: 1.4;
        }

        .status-card-time {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Theme Variants for Banner */
        .theme-return { background: var(--return-bg); }
        .theme-return .status-icon-box { background: var(--return-icon-bg); color: var(--return-theme); }
        .theme-return .status-card-title { color: var(--return-theme); }

        .theme-exchange { background: var(--exchange-bg); }
        .theme-exchange .status-icon-box { background: var(--exchange-icon-bg); color: var(--exchange-theme); }
        .theme-exchange .status-card-title { color: var(--exchange-theme); }

        .theme-alteration { background: var(--alteration-bg); }
        .theme-alteration .status-icon-box { background: var(--alteration-icon-bg); color: var(--alteration-theme); }
        .theme-alteration .status-card-title { color: var(--alteration-theme); }

        .theme-delivered { background: #f0fdf4; }
        .theme-delivered .status-icon-box { background: #dcfce7; color: #16a34a; }
        .theme-delivered .status-card-title { color: #15803d; }

        /* Details Card (Return Details / Exchange Details / Alteration Details) */
        .details-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .details-card-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--navy-primary);
            margin-bottom: 12px;
        }

        .detail-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .detail-row-item:last-child {
            border-bottom: none;
        }

        .detail-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }

        .detail-row-left .material-symbols-outlined {
            font-size: 18px;
            color: #64748b;
        }

        .detail-row-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--navy-primary);
            text-align: right;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        /* Info Blue Banner */
        .info-blue-box {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .info-blue-box .material-symbols-outlined {
            font-size: 18px;
            color: #1d4ed8;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .info-blue-box span {
            font-size: 12.5px;
            font-weight: 500;
            color: #1e40af;
            line-height: 1.4;
        }

        /* Bank Details Warning Card */
        .bank-warning-card {
            background: #fffbe6;
            border: 1px dashed #d97706;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .bank-warning-info h4 {
            font-size: 13px;
            font-weight: 800;
            color: #92400e;
            margin-bottom: 2px;
        }

        .bank-warning-info p {
            font-size: 12px;
            color: #b45309;
        }

        .btn-add-bank {
            background: #d97706;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Masked Bank Account Display Box */
        .masked-acc-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .masked-acc-info {
            font-size: 13px;
            font-weight: 700;
            color: var(--navy-primary);
        }

        .masked-acc-sub {
            font-size: 11px;
            color: var(--navy-muted);
        }

        /* Support Contact Card */
        .support-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--navy-primary);
        }

        .support-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .support-icon-wrap {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
        }

        .support-text h4 {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--navy-primary);
        }

        .support-text p {
            font-size: 12px;
            color: #64748b;
        }

        /* Action Buttons */
        .btn-tracking {
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--navy-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-tracking:active {
            background: #e2e8f0;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-action-primary {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-bg-navy { background: var(--navy-primary); color: #ffffff; }
        .btn-bg-blue { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
        .btn-bg-green { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .btn-bg-purple { background: #673ab7; color: #ffffff; }

        /* Expand Details Section Toggle */
        .btn-details-toggle {
            width: 100%;
            background: none;
            border: 1px dashed var(--border);
            color: var(--navy-muted);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .details-expand-panel {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        /* Modal Overlay & Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            z-index: 1000;
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-modal);
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #f1f5f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title { font-size: 18px; font-weight: 800; color: var(--navy-primary); margin-bottom: 4px; }
        .modal-subtitle { font-size: 13px; color: var(--navy-muted); margin-bottom: 20px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sub); margin-bottom: 6px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; background: #ffffff; }

        .adj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .adj-pill { padding: 10px 4px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--navy-primary); cursor: pointer; text-align: center; }
        .adj-pill.active { background: var(--navy-primary); color: #ffffff; border-color: var(--navy-primary); }

        /* Bottom Fixed Navigation (Preserved) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 12px 0;
            z-index: 90;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--navy-primary);
            font-weight: 800;
        }

        .nav-item .material-symbols-outlined {
            font-size: 22px;
        }
    </style>
</head>

<body>

    <!-- Header Navbar (Preserved Top Bar) -->
    <header class="brand-header">
        <a href="index.html" class="brand-logo">
            <img src="images/logos/slyte-logo-black.png" alt="Slyte Logo">
        </a>
        <a href="https://wa.me/916363887497" target="_blank" class="header-help-btn">
            <span class="material-symbols-outlined" style="font-size:16px">help_outline</span> Need Help?
        </a>
    </header>

    <div class="container">
        <!-- Phone Lookup Card -->
        <div class="lookup-card">
            <h1>Look Up Your Orders</h1>
            <p>Enter the mobile number used during checkout to view order details & status.</p>
            <div class="input-group">
                <div class="phone-input-wrap">
                    <span class="phone-prefix">+91</span>
                    <input type="tel" id="mobileInput" placeholder="97420 06683" maxlength="10">
                </div>
                <button id="trackBtn" onclick="fetchOrders()">Look Up</button>
            </div>
        </div>

        <!-- Scenario Tester / Simulator Bar -->
        <div class="scenario-bar">
            <label>
                <span>🧪 Test Journey Simulator (Mobile 9742006683)</span>
                <span style="font-size:10px; color:#64748b;">Live Preview</span>
            </label>
            <select id="scenarioSelect" class="scenario-select" onchange="applyScenarioSimulation()">
                <option value="REAL">Standard Live Order Flow (Default)</option>
                <optgroup label="1. Normal Delivered">
                    <option value="SIM_DELIVERED">1. Delivered Order (Standard / Custom)</option>
                </optgroup>
                <optgroup label="2. Return Journey Scenarios">
                    <option value="SIM_RET_REQ">2. Return Requested (With Bank Warning)</option>
                    <option value="SIM_RET_PICKED">3. Return Picked Up (In Transit)</option>
                    <option value="SIM_RET_REC">4. Return Received at Slyte</option>
                    <option value="SIM_RET_REFUNDED">5. Refund Processed (Completed)</option>
                </optgroup>
                <optgroup label="3. Exchange Journey Scenarios">
                    <option value="SIM_EXC_REQ">6. Exchange Requested</option>
                    <option value="SIM_EXC_PICKED">7. Exchange Item Picked Up</option>
                    <option value="SIM_EXC_REC">8. Exchange Item Received</option>
                    <option value="SIM_EXC_SHIPPED">9. Exchange Shipped (Replacement En Route)</option>
                    <option value="SIM_EXC_DELIVERED">10. Exchange Delivered (Completed)</option>
                </optgroup>
                <optgroup label="4. Alteration Journey Scenarios">
                    <option value="SIM_ALT_REQ">11. Alteration Requested</option>
                    <option value="SIM_ALT_PICKED">12. Alteration Picked Up</option>
                    <option value="SIM_ALT_REC">13. Alteration Received at Slyte</option>
                    <option value="SIM_ALT_INPROG">14. Alteration in Progress</option>
                    <option value="SIM_ALT_DONE">15. Alteration Completed</option>
                    <option value="SIM_ALT_SHIPPED">16. Alteration Shipped</option>
                    <option value="SIM_ALT_DELIVERED">17. Alteration Delivered (Completed)</option>

        <!-- Orders Results Container -->
        <div id="resultsArea">

                Enter your phone number above to view orders.

    <nav class="bottom-nav">

            <span class="material-symbols-outlined">local_shipping</span>

            <span class="material-symbols-outlined">person</span>

        </a>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        (function () {
            const API_BASE = (window.SLYTE_API_BASE || window.SLYTE_CONFIG?.API_BASE_URL || 'https://api.slyte.in').replace(/\/+$/, '');
            let currentOrders = [];
            let activeSimulationKey = "REAL";

            function esc(s) {
                return (s || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function fmtDate(dStr) {
                if (!dStr) return '14 Sep 2025';
                const d = new Date(dStr);
                return isNaN(d.getTime()) ? dStr : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            window.fetchOrders = async function () {
                const phoneInput = document.getElementById('mobileInput');
                const resultsArea = document.getElementById('resultsArea');
                const rawPhone = phoneInput.value.replace(/\D/g, '').slice(-10);

                if (rawPhone.length < 10) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:20px; color:var(--return-theme); font-weight:600;">Please enter a valid 10-digit mobile number.</div>`;
                    return;
                }

                localStorage.setItem('slyte_phone', rawPhone);
                resultsArea.innerHTML = `<div style="text-align:center; padding:40px; color:var(--navy-muted); font-size:14px;">Loading your orders...</div>`;

                try {
                    const token = localStorage.getItem('slyte_otp_token');
                    const res = await fetch(`${API_BASE}/orders/lookup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({ phone: rawPhone })
                    });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.orders)) {
                        currentOrders = data.orders;
                        renderOrders(currentOrders);
                    } else {
                        resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--navy-muted); font-size:14px;">No orders found for +91 ${rawPhone}.</div>`;
                    }
                } catch (err) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--return-theme); font-size:14px;">Could not connect to server. Please try again.</div>`;
                }
            };

            window.applyScenarioSimulation = function() {
                activeSimulationKey = document.getElementById('scenarioSelect').value;
                if (currentOrders && currentOrders.length > 0) {
                    renderOrders(currentOrders);
                } else {
                    currentOrders = [{
                        orderId: "SLYTE-TEST-ORDER-001",
                        displayId: "#SLY12589",
                        productName: "Slyte 24H Navy Trouser",
                        fitType: "Standard Fit",
                        productType: "STANDARD",
                        amount: 1699,
                        paymentGroup: "Cashfree UPI",
                        createdAt: new Date().toISOString(),
                        deliveryAddress: {
                            fullName: "Valued Customer",
                            addressLine1: "123 Test Street, Koramangala",
                            city: "Bengaluru",
                            state: "Karnataka",
                            pincode: "560034"
                        },
                        orderLifecycleStatus: "DELIVERED"
                    }];
                    renderOrders(currentOrders);
                }
            };

            function renderOrders(ordersList) {
                const resultsArea = document.getElementById('resultsArea');
                if (!ordersList || !ordersList.length) {
                    resultsArea.innerHTML = `<div style="text-align:center; padding:30px; color:var(--navy-muted);">No orders found.</div>`;
                    return;
                }

                resultsArea.innerHTML = ordersList.map((rawOrder) => {
                    const order = applyStateTransformation(rawOrder, activeSimulationKey);
                    const mode = order.journeyMode; // NORMAL, RETURN, EXCHANGE, ALTERATION

                    // Image map for product thumbnail
                    let imgSrc = "images/homepage/ai-output-placeholder.webp";
                    if (order.productName && order.productName.toLowerCase().includes('beige')) imgSrc = "beigegurkha.webp";
                    else if (order.productName && order.productName.toLowerCase().includes('black')) imgSrc = "DeepBlackPleatedGurkhaPant.jpg";

                    return `
                    <div class="order-card" id="card-${esc(order.orderId)}">
                        <!-- Top Order Details Header -->
                        <div class="order-top-header">
                            <span class="title">Order Details</span>
                            <span class="code">${esc(order.displayId || '#' + order.orderId)}</span>
                        </div>

                        <!-- Product Hero Card Header -->
                        <div class="product-hero-block">
                            <img src="${imgSrc}" class="product-thumb" alt="Product Thumbnail">
                            <div class="product-info-col">
                                <div class="product-title">${esc(order.productName || 'Slyte 24H Navy Trouser')}</div>
                                <div class="fit-label">${esc(order.fitType || 'Standard Fit')}</div>
                                <span class="type-badge ${order.productType === 'CUSTOM' ? 'badge-custom' : 'badge-standard'}">
                                    ${order.productType === 'CUSTOM' ? 'Custom' : 'Standard'}
                                </span>
                            </div>
                        </div>

                        <!-- Stepper Timeline -->
                        ${renderJourneyStepper(mode, order.stepIndex, order.stepperConfig)}

                        <!-- Status Banner Card -->
                        <div class="status-card ${order.themeClass}">
                            <div class="status-icon-box">
                                <span class="material-symbols-outlined">${order.statusIcon}</span>
                            </div>
                            <div class="status-card-content">
                                <div class="status-card-title">${order.bannerTitle}</div>
                                <div class="status-card-desc">${order.bannerMessage}</div>
                                <div class="status-card-time">${order.timestampStr || '15 Sep, 4:20 PM'}</div>
                            </div>
                        </div>

                        <!-- Bank Details Warning Card if Return & Bank Details missing -->
                        ${(mode === 'RETURN' && order.needsBankDetails) ? `
                        <div class="bank-warning-card">
                            <div class="bank-warning-info">
                                <h4>Refund details required</h4>
                                <p>Add your bank account details so we can process your refund.</p>
                            </div>
                            <button class="btn-add-bank" onclick="openBankDetailsModal('${esc(order.orderId)}')">Add Bank Details</button>
                        </div>` : ''}

                        <!-- Masked Bank Display Box -->
                        ${(mode === 'RETURN' && order.bankDetailsSaved) ? `
                        <div class="masked-acc-box">
                            <div>
                                <div class="masked-acc-info">Account ending •••• ${esc(order.bankDetailsSaved.maskedAcc)}</div>
                                <div class="masked-acc-sub">IFSC: ${esc(order.bankDetailsSaved.ifsc)}</div>
                            </div>
                            <button class="btn-action-primary btn-bg-blue" style="padding:6px 12px; font-size:11px;" onclick="openBankDetailsModal('${esc(order.orderId)}')">Edit</button>
                        </div>` : ''}

                        <!-- Journey Details Card (Exact Mockup Match) -->
                        ${renderJourneyDetailsCard(mode, order)}

                        <!-- Info Blue Banner -->
                        <div class="info-blue-box">
                            <span class="material-symbols-outlined">info</span>
                            <span>${order.infoBannerText}</span>
                        </div>

                        <!-- Support Card (Need Help?) -->
                        <a href="https://wa.me/916363887497" target="_blank" class="support-card">
                            <div class="support-left">
                                <div class="support-icon-wrap">
                                    <span class="material-symbols-outlined">headset_mic</span>
                                </div>
                                <div class="support-text">
                                    <h4>Need Help?</h4>
                                    <p>Contact our support team</p>
                                </div>
                            </div>
                            <span class="material-symbols-outlined" style="color:#94a3b8;">chevron_right</span>
                        </a>

                        <!-- Action Buttons -->
                        ${renderActionButtons(mode, order)}

                        <!-- Show Details Toggle -->
                        <button class="btn-details-toggle" id="btn-toggle-${esc(order.orderId)}" onclick="toggleDetails('${esc(order.orderId)}')">
                            Show Order Info ▼
                        </button>

                        <div class="details-expand-panel" id="expand-${esc(order.orderId)}">
                            <div style="font-size:12px; font-weight:800; text-transform:uppercase; color:#94a3b8; margin-bottom:8px;">Order Summary</div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
                                <span style="color:#64748b;">Order Amount</span>
                                <span style="font-weight:700;">₹${order.amount || 1699}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
                                <span style="color:#64748b;">Payment Mode</span>
                                <span style="font-weight:700;">${esc(order.paymentGroup || 'Cashfree UPI')}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
                                <span style="color:#64748b;">Delivery Address</span>
                                <span style="font-weight:600; text-align:right;">${esc(order.deliveryAddress?.addressLine1 || '123 Test Street')}, ${esc(order.deliveryAddress?.city || 'Bengaluru')}</span>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            // State Resolver & Simulator Engine
            function applyStateTransformation(order, simKey) {
                const o = JSON.parse(JSON.stringify(order));
                const lcs = (o.orderLifecycleStatus || 'DELIVERED').toUpperCase();
                o.size = o.size || '32';
                o.productType = o.productType || (o.fitType && o.fitType.toLowerCase().includes('custom') ? 'CUSTOM' : 'STANDARD');

                const storedBank = localStorage.getItem(`bank_${o.orderId}`);
                if (storedBank) {
                    try {
                        const parsed = JSON.parse(storedBank);
                        o.bankDetailsSaved = {
                            maskedAcc: parsed.account_number.slice(-4) || '4821',
                            ifsc: parsed.ifsc_code || 'HDFC0001234'
                        };
                    } catch(e){}
                }

                if (simKey && simKey !== 'REAL') {
                    return getSimulatedState(o, simKey);
                }

                // Default Real Backend Journey Resolver
                if (['RETURN_INITIATED', 'RTO_IN_TRANSIT', 'RTO_DELIVERED', 'REFUNDED'].includes(lcs)) {
                    o.journeyMode = 'RETURN';
                    o.themeClass = 'theme-return';
                    o.stepperConfig = [
                        { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                        { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                        { label: 'Refund Processing', date: '', icon: 'currency_rupee' },
                        { label: 'Refunded', date: '', icon: 'check' }
                    ];
                    o.infoBannerText = 'Once we receive your return at our warehouse, your refund will be processed automatically.';
                    o.trackingId = 'SR123456789';

                    if (lcs === 'RETURN_INITIATED') {
                        o.stepIndex = 0; o.statusIcon = 'package_2'; o.bannerTitle = 'Return Requested'; o.bannerMessage = "Your return request has been confirmed. We'll arrange a pickup soon.";
                        if (!o.bankDetailsSaved) o.needsBankDetails = true;
                    } else if (lcs === 'RTO_IN_TRANSIT') {
                        o.stepIndex = 1; o.statusIcon = 'local_shipping'; o.bannerTitle = 'Picked Up'; o.bannerMessage = 'Your return has been picked up and is on its way to our warehouse.';
                    } else if (lcs === 'RTO_DELIVERED') {
                        o.stepIndex = 2; o.statusIcon = 'inventory_2'; o.bannerTitle = 'Return Received'; o.bannerMessage = 'Your return has reached us. Your refund is now being processed.';
                    } else if (lcs === 'REFUNDED') {
                        o.stepIndex = 3; o.statusIcon = 'check_circle'; o.bannerTitle = 'Refund Processed'; o.bannerMessage = `₹${o.amount || 1699} has been refunded successfully.`;
                    }
                } else if (lcs.startsWith('EXCHANGE_')) {
                    o.journeyMode = 'EXCHANGE';
                    o.themeClass = 'theme-exchange';
                    o.stepperConfig = [
                        { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                        { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                        { label: 'Exchange Shipped', date: '', icon: 'warehouse' },
                        { label: 'Delivered', date: '', icon: 'check' }
                    ];
                    o.infoBannerText = "Once we receive your return at our warehouse, we'll ship your exchange item.";
                    o.trackingId = 'SR123456789';
                    o.exchangeNewSize = '34';

                    if (lcs === 'EXCHANGE_REQUESTED') {
                        o.stepIndex = 0; o.statusIcon = 'package_2'; o.bannerTitle = 'Exchange Requested'; o.bannerMessage = 'Exchange confirmed. Replacement size will be prepared upon pickup.';
                    } else if (lcs === 'EXCHANGE_PICKED_UP') {
                        o.stepIndex = 1; o.statusIcon = 'local_shipping'; o.bannerTitle = 'Picked Up'; o.bannerMessage = 'Your exchange item has been picked up and is on its way to our warehouse.';
                    } else if (lcs === 'EXCHANGE_RECEIVED') {
                        o.stepIndex = 2; o.statusIcon = 'inventory_2'; o.bannerTitle = 'Exchange Item Received'; o.bannerMessage = 'We have received your item. Preparing replacement size 34.';
                    } else if (lcs === 'EXCHANGE_SHIPPED') {
                        o.stepIndex = 2; o.statusIcon = 'warehouse'; o.bannerTitle = 'Exchange Shipped'; o.bannerMessage = 'Your replacement trousers are on the way.';
                    } else if (lcs === 'EXCHANGE_DELIVERED') {
                        o.stepIndex = 3; o.statusIcon = 'check_circle'; o.bannerTitle = 'Delivered'; o.bannerMessage = 'Your replacement trousers have been delivered.';
                    }
                } else if (lcs.startsWith('ALTERATION_')) {
                    o.journeyMode = 'ALTERATION';
                    o.themeClass = 'theme-alteration';
                    o.stepperConfig = [
                        { label: 'Alteration Requested', date: '14 Sep', icon: 'package_2' },
                        { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                        { label: 'Under Alteration', date: '', icon: 'content_cut' },
                        { label: 'Out for Delivery', date: '', icon: 'local_shipping' },
                        { label: 'Delivered', date: '', icon: 'check' }
                    ];
                    o.infoBannerText = "Once the alteration is completed, we'll ship your item back to you. You'll be notified at each step.";
                    o.trackingId = 'SR123456789';

                    if (lcs === 'ALTERATION_REQUESTED') {
                        o.stepIndex = 0; o.statusIcon = 'package_2'; o.bannerTitle = 'Alteration Requested'; o.bannerMessage = "We'll arrange a pickup for your trousers.";
                    } else if (lcs === 'ALTERATION_PICKED_UP') {
                        o.stepIndex = 1; o.statusIcon = 'local_shipping'; o.bannerTitle = 'Picked Up'; o.bannerMessage = 'Your item for alteration has been picked up and is on its way to our warehouse.';
                    } else if (lcs === 'ALTERATION_RECEIVED' || lcs === 'ALTERATION_IN_PROGRESS') {
                        o.stepIndex = 2; o.statusIcon = 'content_cut'; o.bannerTitle = 'Under Alteration'; o.bannerMessage = 'Our master tailors are working on your custom trousers.';
                    } else if (lcs === 'ALTERATION_SHIPPED') {
                        o.stepIndex = 3; o.statusIcon = 'local_shipping'; o.bannerTitle = 'Out for Delivery'; o.bannerMessage = 'Your altered trousers are out for delivery.';
                    } else if (lcs === 'ALTERATION_DELIVERED') {
                        o.stepIndex = 4; o.statusIcon = 'check_circle'; o.bannerTitle = 'Delivered'; o.bannerMessage = 'Your altered trousers have been delivered. We hope they fit perfectly.';
                    }
                } else {
                    // Normal Forward Delivered
                    o.journeyMode = 'NORMAL';
                    o.themeClass = 'theme-delivered';
                    o.stepperConfig = [
                        { label: 'Order Placed', date: '12 Sep', icon: 'package_2' },
                        { label: 'Dispatched', date: '13 Sep', icon: 'warehouse' },
                        { label: 'Out for Delivery', date: '14 Sep', icon: 'local_shipping' },
                        { label: 'Delivered', date: '14 Sep', icon: 'check' }
                    ];
                    o.stepIndex = 3; o.statusIcon = 'check_circle'; o.bannerTitle = 'Delivered'; o.bannerMessage = 'Enjoy your order.';
                    o.infoBannerText = 'Need a return, exchange, or alteration? Choose an option below within 7 days.';
                }

                return o;
            }

            // Scenario Simulator Mapping (Matches Mockups 1:1)
            function getSimulatedState(o, key) {
                const copy = JSON.parse(JSON.stringify(o));
                copy.trackingId = 'SR123456789';
                copy.timestampStr = '15 Sep, 4:20 PM';

                switch(key) {
                    case 'SIM_DELIVERED':
                        copy.journeyMode = 'NORMAL'; copy.themeClass = 'theme-delivered';
                        copy.stepperConfig = [
                            { label: 'Order Placed', date: '12 Sep', icon: 'package_2' },
                            { label: 'Dispatched', date: '13 Sep', icon: 'warehouse' },
                            { label: 'Out for Delivery', date: '14 Sep', icon: 'local_shipping' },
                            { label: 'Delivered', date: '14 Sep', icon: 'check' }
                        ];
                        copy.stepIndex = 3; copy.statusIcon = 'check_circle'; copy.bannerTitle = 'Delivered'; copy.bannerMessage = 'Enjoy your order.';
                        copy.infoBannerText = 'Includes 7-day return/exchange window and custom alterations.';
                        break;

                    case 'SIM_RET_REQ':
                        copy.journeyMode = 'RETURN'; copy.themeClass = 'theme-return';
                        copy.stepperConfig = [
                            { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '', icon: 'local_shipping' },
                            { label: 'Refund Processing', date: '', icon: 'currency_rupee' },
                            { label: 'Refunded', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 0; copy.statusIcon = 'package_2'; copy.bannerTitle = 'Return Requested'; copy.bannerMessage = "Your return request has been confirmed. We'll arrange a pickup soon.";
                        copy.infoBannerText = 'Once we receive your return at our warehouse, your refund will be processed automatically.';
                        if (!copy.bankDetailsSaved) copy.needsBankDetails = true;
                        break;

                    case 'SIM_RET_PICKED':
                        copy.journeyMode = 'RETURN'; copy.themeClass = 'theme-return';
                        copy.stepperConfig = [
                            { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Refund Processing', date: '', icon: 'currency_rupee' },
                            { label: 'Refunded', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 1; copy.statusIcon = 'local_shipping'; copy.bannerTitle = 'Picked Up'; copy.bannerMessage = 'Your return has been picked up and is on its way to our warehouse.';
                        copy.infoBannerText = 'Once we receive your return at our warehouse, your refund will be processed automatically.';
                        break;

                    case 'SIM_RET_REC':
                        copy.journeyMode = 'RETURN'; copy.themeClass = 'theme-return';
                        copy.stepperConfig = [
                            { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Refund Processing', date: '16 Sep', icon: 'currency_rupee' },
                            { label: 'Refunded', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 2; copy.statusIcon = 'inventory_2'; copy.bannerTitle = 'Return Received'; copy.bannerMessage = 'Your return has reached us. Your refund is now being processed.';
                        copy.infoBannerText = 'Refund processing initiated to your bank account.';
                        break;

                    case 'SIM_RET_REFUNDED':
                        copy.journeyMode = 'RETURN'; copy.themeClass = 'theme-delivered';
                        copy.stepperConfig = [
                            { label: 'Return Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Refund Processing', date: '16 Sep', icon: 'currency_rupee' },
                            { label: 'Refunded', date: '16 Sep', icon: 'check' }
                        ];
                        copy.stepIndex = 3; copy.statusIcon = 'check_circle'; copy.bannerTitle = 'Refund Processed'; copy.bannerMessage = '₹1,699 has been refunded successfully to your bank account.';
                        copy.infoBannerText = 'Refund completed to Bank Account ending •••• 4821.';
                        copy.bankDetailsSaved = { maskedAcc: '4821', ifsc: 'HDFC0001234' };
                        break;

                    case 'SIM_EXC_REQ':
                        copy.journeyMode = 'EXCHANGE'; copy.themeClass = 'theme-exchange';
                        copy.stepperConfig = [
                            { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '', icon: 'local_shipping' },
                            { label: 'Exchange Shipped', date: '', icon: 'warehouse' },
                            { label: 'Delivered', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 0; copy.statusIcon = 'package_2'; copy.bannerTitle = 'Exchange Requested'; copy.bannerMessage = 'Exchange confirmed. Pickup will be arranged soon.';
                        copy.infoBannerText = "Once we receive your return at our warehouse, we'll ship your exchange item.";
                        copy.exchangeNewSize = '34';
                        break;

                    case 'SIM_EXC_PICKED':
                        copy.journeyMode = 'EXCHANGE'; copy.themeClass = 'theme-exchange';
                        copy.stepperConfig = [
                            { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Exchange Shipped', date: '', icon: 'warehouse' },
                            { label: 'Delivered', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 1; copy.statusIcon = 'local_shipping'; copy.bannerTitle = 'Picked Up'; copy.bannerMessage = 'Your exchange item has been picked up and is on its way to our warehouse.';
                        copy.infoBannerText = "Once we receive your return at our warehouse, we'll ship your exchange item.";
                        copy.exchangeNewSize = '34';
                        break;

                    case 'SIM_EXC_REC':
                        copy.journeyMode = 'EXCHANGE'; copy.themeClass = 'theme-exchange';
                        copy.stepperConfig = [
                            { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Exchange Shipped', date: '16 Sep', icon: 'warehouse' },
                            { label: 'Delivered', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 2; copy.statusIcon = 'inventory_2'; copy.bannerTitle = 'Exchange Item Received'; copy.bannerMessage = 'We have received your item. Replacement size 34 is ready to ship.';
                        copy.infoBannerText = "Replacement item is being dispatched.";
                        copy.exchangeNewSize = '34';
                        break;

                    case 'SIM_EXC_SHIPPED':
                        copy.journeyMode = 'EXCHANGE'; copy.themeClass = 'theme-exchange';
                        copy.stepperConfig = [
                            { label: 'Exchange Requested', date: '14 Sep', icon: 'package_2' },
                            { label: 'Picked Up', date: '15 Sep', icon: 'local_shipping' },
                            { label: 'Exchange Shipped', date: '16 Sep', icon: 'warehouse' },
                            { label: 'Delivered', date: '', icon: 'check' }
                        ];
                        copy.stepIndex = 2; copy.statusIcon = 'warehouse'; copy.bannerTitle = 'Exchange Shipped'; copy.bannerMessage = 'Your replacement trousers are on the way.';
                        copy.infoBannerText = "Replacement item is in transit.";
                        copy.exchangeNewSize = '34';
                        break;

                    case 'SIM_EXC_DELIVERED':
                        copy.journeyMode = 'EXCHANGE'; copy.themeClass = 'theme-delivered';
                        copy.stepperConfig = [

            // Stepper Component Renderer (Mockup Exact Line & Circle Match)
            function renderJourneyStepper(mode, activeIndex, steps) {
                if (!steps || !steps.length) return '';
                const total = steps.length;
                const percent = Math.min(100, Math.max(0, (activeIndex / (total - 1)) * 100));

                let color = '#dc2626';
                if (mode === 'EXCHANGE') color = '#2563eb';
                else if (mode === 'ALTERATION') color = '#16a34a';
                else if (mode === 'NORMAL') color = '#16a34a';

                return `
                <div class="timeline-stepper">
                    <div class="timeline-line-bg"></div>
                    <div class="timeline-line-progress" style="width: calc(${percent}% - 20px); background: ${color};"></div>
                    ${steps.map((s, idx) => {
                        let stateCls = '';
                        if (idx < activeIndex) stateCls = 'done';
                        else if (idx === activeIndex) stateCls = 'active';

                        const circleBg = (idx <= activeIndex) ? color : '#ffffff';
                        const iconColor = (idx <= activeIndex) ? '#ffffff' : '#94a3b8';

                        return `
                        <div class="step-node ${stateCls}">
                            <div class="node-circle" style="background:${circleBg}; border-color:${idx <= activeIndex ? 'transparent' : '#e2e8f0'}; color:${iconColor};">
                                <span class="material-symbols-outlined">${s.icon || 'check'}</span>
                            </div>
                            <div class="node-label">${s.label}</div>
                            ${s.date ? `<div class="node-date">${s.date}</div>` : ''}
                        </div>`;
                    }).join('')}
                </div>`;
            }

            window.saveBankDetails = async function(orderId) {
                const name = document.getElementById('bankName').value.trim();
                const acc = document.getElementById('bankAcc').value.trim();
                const confirmAcc = document.getElementById('bankAccConfirm').value.trim();
                const ifsc = document.getElementById('bankIfsc').value.trim().toUpperCase();
                const errBox = document.getElementById('modalErr');

                if (!name) { errBox.textContent = 'Account holder name is required.'; errBox.style.display = 'block'; return; }
                if (!acc || acc.length < 8) { errBox.textContent = 'Please enter a valid bank account number.'; errBox.style.display = 'block'; return; }
                if (acc !== confirmAcc) { errBox.textContent = 'Confirm Account Number does not match.'; errBox.style.display = 'block'; return; }
                if (!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) { errBox.textContent = 'Please enter a valid 11-digit IFSC code (e.g. HDFC0001234).'; errBox.style.display = 'block'; return; }

                errBox.style.display = 'none';
                const bankObj = { account_name: name, account_number: acc, ifsc_code: ifsc };
                localStorage.setItem(`bank_${orderId}`, JSON.stringify(bankObj));

                try {

                        headers: { 'Content-Type': 'application/json' },

                            <button type="button" class="adj-pill length-pill active" onclick="setLength(this,'0.0')">0" (Current)</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+0.5')">+0.5"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+1.0')">+1.0"</button>
                            <button type="button" class="adj-pill length-pill" onclick="setLength(this,'+1.5')">+1.5"</button>
                        </div>
                    </div>

                    <button class="btn-action-primary btn-bg-purple" style="width:100%;" onclick="submitAlteration('${esc(orderId)}')">
                        Submit Alteration Request
                    </button>`;
                overlay.style.display = 'flex';
            };

            window.setWaist = function(btn, val) {
                document.querySelectorAll('.waist-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selWaist = val;
            };

            window.setLength = function(btn, val) {
                document.querySelectorAll('.length-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selLength = val;
            };

            window.submitAlteration = async function(orderId) {
                try {
                    await fetch(`${API_BASE}/api/after-sales/alteration`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            order_id: orderId,
                            alteration_type: `Waist: ${selWaist}", Length: ${selLength}"`,
                            measurements: { waist_diff: selWaist, length_diff: selLength }
                        })
                    });
                } catch(e){}

                closeModal();
                fetchOrders();
            };

            const savedPhone = localStorage.getItem('slyte_phone') || localStorage.getItem('userPhone');
            if (savedPhone) {
                document.getElementById('mobileInput').value = savedPhone.replace(/\D/g, '').slice(-10);
                fetchOrders();
            }

        })();
    </script>
</body>

</html>
